ants) Act. Either could leave her better off than a life interest that ends on remarriage. Time limits apply and she should be advised promptly.</li>\n</ol>\n<p><strong>9. Recommended next steps</strong></p>\n<ol type=\"1\">\n<li>Obtain the grant of probate and a title search for Paradise Close and for Volume 1000 Folio 33.</li>\n<li>Confirm that Mr Biggs and Mr Small are alive and willing to act.</li>\n<li>Take instructions on the identity of the children and of the witness Thomas Most.</li>\n<li>Advise Sue separately on her position under clause 3 and on her statutory rights as surviving spouse.</li>\n<li>Prepare the transmission application and transfer to give effect to clause 3.</li>\n</ol>\n<h2 id=\"how-its-marked-20-marks-1\">How it\u2019s marked (20 marks)</h2>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Element</th>\n<th>Marks</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Construes the subject matter and Sue\u2019s estate as a life interest determinable on remarriage</td>\n<td>3</td>\n</tr>\n<tr class=\"even\">\n<td>Identifies the settlement and the tenant for life, with sections</td>\n<td>3</td>\n</tr>\n<tr class=\"odd\">\n<td>Identifies the trustees from the appointment clause and explains why the wording matters</td>\n<td>3</td>\n</tr>\n<tr class=\"even\">\n<td>Sue: powers, duties, capital money, effect of remarriage</td>\n<td>4</td>\n</tr>\n<tr class=\"odd\">\n<td>Bill, Bob and Tom: vested remainder, joint tenancy, no present right of possession, overreaching</td>\n<td>3</td>\n</tr>\n<tr class=\"even\">\n<td>Tom: personal right of occupation, no veto over sale</td>\n<td>2</td>\n</tr>\n<tr class=\"odd\">\n<td>Memorandum form, authority cited, any further defect in the will spotted</td>\n<td>2</td>\n</tr>\n</tbody>\n</table>\n"});
PAST.ch3.push({title:'Worksheet 3: model answers', sub:'Seminar 3, 29 October 2026. Registered Title.', intro:'Try each question from the manual on your own first, under time. Then read the model answer and the notes on how it is marked. One section of the Landliss letter will be added after the Chapter 3 progress quiz is in.', html:"<h1 id=\"how-to-use-these-answers\">How to use these answers</h1>\n<p>The model answers are written for Jamaica under the Registration of Titles Act (\u201cRTA\u201d), the Limitation of Actions Act and the Registration of Titles, Cadastral Mapping and Tenure Clarification (Special Provisions) Act.</p>\n<p>The examiner is testing method, not memory. Marks go to the student who (1) identifies that the client has not yet told us whether the land is registered, (2) explains both systems in a way a layman can follow, (3) sets out the application procedure with the documents and what each must contain, (4) names the public records and how to search them lawfully and (5) asks the right questions before giving a view on whether Johnathon can build. The notes after each answer link these points to the five criteria in the School's rubric.</p>\n<h1 id=\"question-1-letter-to-johnathon-landliss\">Question 1: letter to Johnathon Landliss</h1>\n<h2 id=\"issues-the-question-raises\">Issues the question raises</h2>\n<ol type=\"1\">\n<li>Johnathon does not know whether the land is registered. \u201cFamily land\u201d and \u201cmy grandfather always said\u201d are not title. The first job is to find out what the title is, not to assume it.</li>\n<li>He asks \u201cwhat the title reveals as to current ownership and the nature of the interests held\u201d. That is a search question (registered) or an investigation of title question (unregistered). Part (c) and (d) are where that gets answered.</li>\n<li>He wants to build on part of the land. That raises (i) whether he has any interest at all, (ii) whether others (co-owners, occupiers, a possessory claimant) have interests, (iii) subdivision approval under the Local Improvement Act if a portion is to be carved out and (iv) whether an application to bring the land under the Act, or a systematic adjudication under the Special Provisions Act, is the realistic route.</li>\n<li>Ethics and privacy: how to obtain information about living people lawfully (public searches are fine; pretexting relatives or the tax office is not; the Data Protection Act applies to personal data we collect).</li>\n</ol>\n<h2 id=\"model-letter\">Model letter</h2>\n<p>[HMF letterhead]</p>\n<p>[Date]</p>\n<p>Mr Johnathon Landliss [Address in the United States]</p>\n<p>By email and post</p>\n<p>Dear Mr Landliss</p>\n<p><strong>Re: the family land at [district], [parish], and your proposed retirement home</strong></p>\n<p>Thank you for your instructions. You have asked us to find out who owns the land your family lived on when you were a child, what interests exist in it and whether you can build your retirement home on part of it. This letter explains the two systems of land title in Jamaica, how unregistered land is brought under the Registration of Titles Act, where else we can look for information and what we need from you before we can give you a firm answer.</p>\n<p><strong>1. Registered and unregistered title</strong></p>\n<p>Jamaica has two systems of holding land.</p>\n<p>Under the Registration of Titles Act the State keeps a Register Book of Titles. Each parcel has its own certificate of title, identified by volume and folio number. The original is bound up in the Register Book at the National Land Agency and a duplicate is issued to the owner, who is called the registered proprietor (ss.25 and 26). The certificate names the proprietor, describes the land by reference to a survey plan and lists the mortgages, restrictive covenants, easements and caveats that affect it. Anyone may search the Register on payment of the fee (s.76). The certificate is conclusive evidence that the person named is the owner (s.68) and that ownership is, subject to limited exceptions, immune from attack by earlier claims (s.71). Nothing you sign passes ownership until it is registered (ss.59 and 63). If the Registrar makes a mistake and someone loses out, the Act provides for compensation from an assurance fund (ss.158 to 164). Lawyers describe this with three words: the Register mirrors the title, it draws a curtain across the history behind it and the State insures its accuracy.</p>\n<p>Unregistered, or common law, land has no certificate and no State guarantee. Ownership is proved by a chain of documents and events going back at least forty years to a good root of title (Vendors and Purchasers Act s.2): conveyances, wills, grants of probate or administration, death certificates and so on. Deeds are recorded at the Island Record Office, but recording only fixes priority between competing deeds; it does not validate them and the Record Office does not say who owns the land. A purchaser or lender has to read every link in the chain. Where a family has occupied land for generations without formal documents, which is what \u201cfamily land\u201d usually means, the land is almost always unregistered and the legal owner is frequently a long-dead ancestor whose estate was never administered.</p>\n<p>Which system applies to your family\u2019s land is the first thing we must establish, and we can do that by search before you return.</p>\n<p><strong>2. Bringing unregistered land under the Act</strong></p>\n<p>If the land is unregistered, the route to a secure title is an application to bring the land under the Act (RTA ss.28 to 37 and 42 to 46). In outline:</p>\n<ol type=\"a\">\n<li><p><em>Who may apply.</em> The application is made by the person claiming to be the owner of the fee simple at law or in equity (s.28). That could be you, if you can show you inherited or acquired the land, or whoever now holds the legal estate. Other categories in s.28 include the Commissioner of Lands for Crown land, a guardian on behalf of an infant, a tenant for life exercising a power of sale, a mortgagor with the mortgagee\u2019s consent, a mortgagee exercising a power of sale and a vendor of common law title at a purchaser\u2019s request (s.49).</p></li>\n<li><p><em>The application.</em> It must be in the form prescribed by the Act (the forms are on the National Land Agency\u2019s eLandJamaica website), signed by the applicant before a Justice of the Peace, and must state: the applicant\u2019s particulars; a description of the land, either by metes and bounds or by reference to a plan (s.30); the value of the land and buildings; whether the land is occupied and by whom; the names and addresses of the owners and occupiers of adjoining land; the mortgages and encumbrances affecting it; and a statement that the applicant knows of no document or fact invalidating his title and of no other person with a legal or equitable interest.</p></li>\n<li><p><em>Documents lodged with it.</em> (i) A statutory declaration by the applicant setting out how he came to be in possession and for how long. (ii) Two supporting declarations by independent persons who have known the land for at least thirty years, confirming open, continuous and undisturbed possession by the applicant and his predecessors. These are required whether or not there are documents of title. (iii) The original deeds, wills, grants of probate or administration and receipts on which the claim rests. (iv) A pre-checked survey plan or diagram prepared by a commissioned land surveyor and approved by the Director of Surveys, with the surveyor\u2019s statutory declaration, if the land is to be registered by plan; if it is registered by metes and bounds, the application must give the length and bearing of each boundary and the names of adjoining owners. (v) Proof that property taxes and quit rents are paid up to date. Since the 2020 amendment this is provided once provisional approval is granted, not with the application (s.29(2)). (vi) The registration fees. Where documents are held by someone else, the court can order their production and inspection (s.40).</p></li>\n<li><p><em>What the Registrar does.</em> The Registrar checks the application and sends the plan to the Survey and Mapping Division to confirm the land is not already registered. The papers then go to the Referee of Titles. If satisfied, the Referee provisionally approves the application and directs advertisement in the Gazette and a newspaper for a period he fixes, with notice served on adjoining occupiers (s.33). Anyone claiming an interest may lodge a caveat against the application within the time stated in the notice (ss.43 to 45). The caveat lapses one month after lodgement unless the caveator starts proceedings or obtains an injunction and serves notice on the Registrar (s.45). If no caveat is lodged, the Registrar registers the applicant\u2019s title (s.37) and issues the certificate, in practice about seven weeks after the first advertisement.</p></li>\n<li><p><em>What you get.</em> The Referee may direct a certificate of absolute title (s.26) or, if the title is imperfect in some respect, a certificate of qualified title (s.27), which gives the same estate subject to the qualification endorsed on it and can later be upgraded.</p></li>\n<li><p><em>Possession-based claims.</em> If nobody in your family has documents of title, the application can rest on adverse possession. Twelve years of exclusive possession extinguishes the former owner\u2019s right to recover the land (Limitation of Actions Act s.3), but the applicant must then identify the former owner and prove that his title has been extinguished. Where the former owner cannot be identified, the Referee has traditionally required thirty years\u2019 possession, because ss.17 and 19 of the Limitation of Actions Act extend the period where the owner was under a disability, up to a maximum of thirty years. In Hall and Pitter v Registrar of Titles [2016] JMSC Civ 203 Batts J held that an applicant need not prove the former owner was free of disability and that twelve years is the relevant period absent evidence of disability. The Referees have not uniformly adopted that view, so you should budget for the thirty-year evidential standard.</p></li>\n<li><p><em>Systematic adjudication.</em> If the land falls within an area declared under the Registration of Titles, Cadastral Mapping and Tenure Clarification (Special Provisions) Act, there is a cheaper route. A claim is made to the Director of Adjudication Services or the local Adjudication Committee, which can issue an adjudication certificate under s.9 declaring the applicant absolute owner on twelve years\u2019 sole, quiet, undisputed possession or on good title, or a qualified certificate where possession is shown but ownership is doubtful. The Registrar then issues a certificate of title on that certificate without reference to the Referee (s.28A(1)(b), added in 2020), and subdivision approval may be waived by the National Land Agency. We will check whether your district has been declared.</p></li>\n</ol>\n<p><strong>3. Other sources of information</strong></p>\n<p>Apart from what you and your relatives can tell us, the following records bear on the title:</p>\n<ul>\n<li>The Register Book of Titles and the Titles Office indexes at the National Land Agency, to establish whether the land or any part of it is registered and, if so, in whose name and subject to what.</li>\n<li>The Island Record Office, for deeds of conveyance, wills and grants recorded against your grandfather and other family members.</li>\n<li>The Supreme Court probate registry, to find out whether any estate in the family was administered and in whose favour.</li>\n<li>The Survey and Mapping Division of the National Land Agency, for cadastral and registered map sheets and any deposited plans covering the district.</li>\n<li>Tax Administration Jamaica, for the valuation number and the name in which property tax is assessed and paid.</li>\n<li>The municipal corporation, for subdivision approvals, building permits and enforcement notices.</li>\n<li>The National Land Agency\u2019s list of declared systematic adjudication areas.</li>\n<li>The land itself: an inspection, and conversations with occupiers and neighbours, will tell us who is in possession and for how long.</li>\n</ul>\n<p><strong>4. How that information is lawfully obtained</strong></p>\n<p>The Register Book of Titles is a public record. Any person may search it and the registered instruments on payment of the prescribed fee (s.76), and we can obtain certified copies and a search certificate from the Registrar (s.144). Deeds at the Island Record Office and probate records are likewise open to public search. Map and survey data are obtained through the National Land Agency, usually by a commissioned surveyor instructed by us. Property tax information is available on request by valuation number or with sufficient particulars of the land. Statements from relatives and neighbours are taken with their consent and, where they are to be relied on, reduced to statutory declarations. We do not obtain information by misrepresentation, and personal data we collect about living people is held in accordance with the Data Protection Act. None of this requires a court order, save that if a third party holds documents of title and refuses to produce them, an application under s.40 is available.</p>\n<p><strong>5. What we need from you</strong></p>\n<p>Before we can advise whether you can build, please let us have:</p>\n<ol type=\"1\">\n<li>The name and location of the land, the parish, any civic address, the approximate acreage and a sketch of the boundaries and adjoining owners if you can draw one.</li>\n<li>Your family tree so far as it concerns the land: your grandfather\u2019s full name and date of death, whether he left a will, who his children were and which of them are alive, your own line of descent and whether anyone obtained a grant of probate or administration in any of those estates.</li>\n<li>Any papers in the family\u2019s possession: deeds, receipts, tax notices, letters from government agencies, old survey plans.</li>\n<li>Who is on the land now, in what capacity, for how long and whether anyone has sold, leased or given away any part of it.</li>\n<li>Whether any family member disputes your right, has lodged a caveat or has made an application of their own.</li>\n<li>Which portion you propose to build on, whether you intend exclusive occupation of it and whether the rest of the family agrees.</li>\n<li>Whether you intend to fund the build with a mortgage, because a lender will insist on registered title in your own name.</li>\n<li>If there is a certificate of title, who holds the duplicate.</li>\n</ol>\n<p>Once we have searched and have your answers we will tell you whether the land is registered, who holds the legal estate, what interests exist and the most direct route to a title in your name for the portion you want to build on. I would caution now that building on family land before title is settled is the most common source of family litigation we see, and that time spent on title first is time well spent.</p>\n<p>Yours faithfully</p>\n<p>[Name] Hart Muirhead Fatta</p>\n<h2 id=\"how-its-marked\">How it\u2019s marked</h2>\n<p>A strong answer will be shorter than the model and still hit these points. Weak answers (a) assume the land is unregistered without saying how they would find out, (b) describe registration in two sentences without the documents, (c) list \u201cthe Titles Office\u201d only and (d) forget the question is about what we need from the client, not what we need to tell him. Give credit for mentioning the Special Provisions Act and for raising subdivision approval if he builds on part only.</p>\n<p><strong>Against the rubric:</strong></p>\n<blockquote>\n<p><em>Issues.</em> Registered or unregistered; who holds the legal estate; other interests and occupiers; building on part; lawful enquiry.</p>\n<p><em>Law and procedure.</em> The application under ss.28 to 46 with the documents and what each must contain; subdivision approval.</p>\n<p><em>Analysis.</em> Applied to family land, a dead grandfather and an absent client, not a general essay on the Torrens system.</p>\n<p><em>Conclusion and advice.</em> What we will do next and what we need from him, in order.</p>\n<p><em>Clarity and presentation.</em> A letter to a lay client in plain English. A memo or an essay loses marks here.</p>\n</blockquote>\n<h1 id=\"question-2-presentation-to-medical-students\">Question 2: presentation to medical students</h1>\n<h2 id=\"issues\">Issues</h2>\n<p>The examiner wants to see whether the student can explain the system in plain language, choose the features that matter to a non-lawyer and organise a short talk. Heavy citation loses marks here. The best answers use one running analogy and one real document.</p>\n<h2 id=\"model-outline-twenty-minutes\">Model outline (twenty minutes)</h2>\n<p><strong>Title:</strong> \u201cWho owns the land? How registered title works in Jamaica\u201d</p>\n<p><strong>1. Why you should care (two minutes).</strong> Most of you will buy a house, a lot or a practice. The thing that makes that purchase safe, or not, is the title system. In Jamaica there are two. One is a filing cabinet of old papers. The other is a State register. I will explain the second.</p>\n<p><strong>2. The Register (four minutes).</strong> The National Land Agency keeps a Register Book of Titles. Each parcel of registered land has its own page, called a certificate of title, identified by a volume and folio number. Show a sample certificate (169 Constant Spring Road, Volume 1080 Folio 977). Point to three things: the description of the land and the plan it refers to; the name of the registered proprietor; and the list of mortgages, restrictive covenants and caveats endorsed on it. One copy lives in the Register. A duplicate is given to the owner. Analogy: the Register is the patient\u2019s chart. The duplicate is the copy the patient carries. Neither is the patient.</p>\n<p><strong>3. The three principles (four minutes).</strong> Mirror: the certificate is supposed to reflect everything that matters about the title. Curtain: a buyer looks at the certificate and need not look behind it at the history. Insurance: if the Registrar gets it wrong and an innocent person loses, the State compensates from an assurance fund. Explain the result: the registered proprietor\u2019s title is \u201cindefeasible\u201d, meaning it cannot be attacked by earlier claims, except in limited cases such as fraud by the proprietor or someone who has been in adverse possession for twelve years. For the doctors: a title is like a diagnosis recorded on the chart; the system treats it as correct, but it can still be overturned if it was obtained by deceit.</p>\n<p><strong>4. How land gets into the system (three minutes).</strong> Some land has been registered since the Act was passed. The rest is brought in by application: the owner proves his title with documents and sworn statements from people who have known the land for thirty years, has it surveyed, applies to the Registrar, the Referee of Titles examines the evidence, the application is advertised so objectors can come forward and, if none do, a certificate issues. Government also runs systematic adjudication in declared areas to register whole communities at once. Analogy: migrating paper records into the electronic system, with verification before anything is entered.</p>\n<p><strong>5. Everyday dealings (four minutes).</strong> Sale: buyer and seller sign a transfer in the prescribed form; nothing changes hands in law until the Registrar registers it and endorses the buyer\u2019s name on the title. Mortgage: the bank registers a charge, which appears on the title so later buyers and lenders can see it; the bank does not become the owner. Caveat: a person who claims an interest but is not on the title can lodge a caveat, which freezes dealings until the claim is resolved. Death: a surviving joint tenant takes by survivorship and notes the death on the title; a sole owner\u2019s land passes to his personal representative, who must be registered before dealing. The rule to remember: if it is not registered, it has not happened.</p>\n<p><strong>6. What the system does not do (two minutes).</strong> Some rights bind the land without appearing on the title: public rights of way, easements by long use, unpaid property tax and water rates, and a tenant in possession under a lease of three years or less. The Register will not show a trust, and it will not tell you who is living on the land. A buyer still visits the property and asks questions. And a title obtained by fraud can be cancelled.</p>\n<p><strong>7. Close (one minute).</strong> Three sentences: title comes from the Register, not from the paper you sign; the proprietor on the Register is protected unless he got there by fraud or has been dispossessed for twelve years; and the State stands behind the Register. Invite questions. Expect \u201cwhat if two people claim the same land\u201d and \u201cwhat about family land\u201d.</p>\n<h2 id=\"how-its-marked-1\">How it\u2019s marked</h2>\n<p>Credit structure, plain language, correct use of the three principles and one accurate account of a dealing. Do not penalise the absence of section numbers. Penalise jargon used without explanation, and any suggestion that signing a transfer makes the buyer the owner.</p>\n<p>Against the rubric, this question leans on clarity and presentation: the right tone for a lay audience, a structure a listener can follow and nothing irrelevant. The law still counts, so the rule that title passes on registration must be right.</p>\n"});

for (const k in QUIZ_X) QUIZ[k] = (QUIZ[k]||[]).concat(QUIZ_X[k]);
for (const k in CARDS_X) CARDS[k] = (CARDS[k]||[]).concat(CARDS_X[k]);

// Score reporting: paste the web app address from your Google Sheet here. Empty means nothing is sent.
const SCORES_URL = "https://script.google.com/macros/s/AKfycbzN7CZphsLeWPxFrzgCEK6WuAy7D4LhkaeA1tWNbCFlXA5w55KUTnST7pFiuRBhEeNi6Q/exec";
const CLASS_CODE = "GROUPN-2026";
function student(){ try{ return JSON.parse(localStorage.getItem("hub-student")||"null"); }catch(e){ return null; } }
function setStudent(v){ try{ localStorage.setItem("hub-student", JSON.stringify(v)); }catch(e){} }
function weak(k){ try{ return JSON.parse(localStorage.getItem("hub-weak-"+k)||"[]"); }catch(e){ return []; } }
function setWeak(k,v){ try{ localStorage.setItem("hub-weak-"+k, JSON.stringify(v)); }catch(e){} }
function hist(k){ try{ return JSON.parse(localStorage.getItem("hub-hist-"+k)||"[]"); }catch(e){ return []; } }
function addHist(k,r){ const h=hist(k); h.push(r); try{ localStorage.setItem("hub-hist-"+k, JSON.stringify(h.slice(-50))); }catch(e){} }
function send(payload){
  const st = student();
  if(!SCORES_URL || !st || !st.consent) return;
  try{ fetch(SCORES_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(Object.assign({code:CLASS_CODE, student:st.name}, payload))}); }catch(e){}
}

const $ = s => document.querySelector(s);
const app = $("#app");
let mode = "round", cur = null, view = "notes", round = 10, deck = [], i = 0, score = 0, misses = [], answered = false;

function shuffle(a){ a = a.slice(); for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1)); [a[j],a[r]]=[a[r],a[j]];} return a; }
function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v);}catch(e){ return null; } }
const isOpen = k => UNLOCKED.includes(k);

function home(){
  cur = null;
  document.documentElement.style.setProperty("--c","#1F3A5F"); document.documentElement.style.setProperty("--l","#DCE6F2");
  const st = student();
  const banner = SCORES_URL ? (st ? `<div class="who ui">Signed in as <b>${st.name}</b>. ${st.consent ? "Your quiz scores are shared with your tutor." : "Your scores stay on this phone."} <button class="linkb" id="chg">Change</button></div>` : `<div class="who ui"><button class="btn" id="chg">Sign in to save your progress</button></div>`) : "";
  app.innerHTML = banner + `<button class="rev ${REVISION_OPEN?"":"locked"}" id="rev" ${REVISION_OPEN?"":"aria-disabled=\"true\""}><span class="ico" aria-hidden="true">${REVISION_OPEN?"&#9733;":"&#128274;"}</span><span><span class="big2 ui">Master revision quiz and flashcards</span><br><span class="sub ui">${REVISION_OPEN?"Every examinable chapter in one bank":"Opens in revision season"}</span></span></button><div class="grid">${CHAPTERS.map(ch => {
    const open = isOpen(ch.k);
    const best = store("hub-best-"+ch.k);
    return `<button class="ch ${open?"":"locked"}" style="--c:${ch.c};--l:${ch.l}" data-k="${ch.k}" ${open?"":"aria-disabled=\"true\""}>
      ${open?"":`<span class="lock" aria-hidden="true">&#128274;</span>`}
      <div class="num">Chapter ${ch.n}</div>
      <div class="t">${ch.title}</div>
      <div class="s">${open ? `<span class="open-tag">${PARTS.every(([p]) => partOpen(ch.k,p)) ? "Open" : "Partly open"}</span>${best ? ` &nbsp;Best ${best}%` : ""}${weak(ch.k).length ? ` &nbsp;${weak(ch.k).length} to review` : ""}` : "Opens after the seminar"}</div>
    </button>`;}).join("")}</div>`;
  if($("#chg")) $("#chg").onclick = signin;
  app.querySelectorAll(".ch").forEach(b => b.onclick = () => { if(isOpen(b.dataset.k)) location.hash = b.dataset.k; });
}


function signin(){
  const st = student() || {name:"", consent:false};
  app.innerHTML = `<button class="back" id="back">&larr; All chapters</button>
   <div class="card"><h2 style="margin-top:0">Save your progress</h2>
   <label class="ui" for="nm">Your name as it appears on the class list</label>
   <input id="nm" value="${st.name.replace(/"/g,"&quot;")}" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin:6px 0 14px">
   <label style="display:flex;gap:10px;align-items:flex-start;font-size:15px"><input type="checkbox" id="ok" ${st.consent?"checked":""} style="margin-top:4px">
   <span>I agree to my name and quiz scores (chapter, score, date and the questions I got wrong) being sent to my tutor, Mr Stimpson, to track my progress. They're stored in a spreadsheet only he can see and used for nothing else. I can untick this at any time and my scores will then stay on this phone.</span></label>
   <div class="row"><button class="btn" id="save">Save</button></div></div>`;
  $("#back").onclick = () => { location.hash = ""; home(); };
  $("#save").onclick = () => {
    const name = $("#nm").value.trim();
    if(!name){ $("#nm").focus(); return; }
    setStudent({name, consent: $("#ok").checked});
    location.hash = ""; home();
  };
}

function chapter(k){
  const ch = CHAPTERS.find(c => c.k === k);
  if(!ch || !isOpen(k)){ location.hash = ""; return home(); }
  cur = ch;
  document.documentElement.style.setProperty("--c", ch.c); document.documentElement.style.setProperty("--l", ch.l);
  app.innerHTML = `<button class="back" id="back">&larr; All chapters</button>
    <div class="chhead"><div class="num">Chapter ${ch.n}</div><h2>${ch.title}</h2></div>
    <div class="tabs" role="tablist">
      ${PARTS.filter(([v]) => v !== "past" || !partOpen(k,"past") || (typeof PAST !== "undefined" && PAST[k])).map(([v,l]) => partOpen(k,v)
        ? `<button class="tab" data-v="${v}" role="tab">${l}</button>`
        : `<button class="tab locked" disabled aria-disabled="true" title="Opens later"><span aria-hidden="true">&#128274;</span> ${l}</button>`).join("")}
    </div>
    <div id="rounds" class="rounds"></div>
    <div id="stage"></div>`;
  $("#back").onclick = () => { location.hash = ""; };
  app.querySelectorAll(".tab:not([disabled])").forEach(t => t.onclick = () => setView(t.dataset.v));
  setView(view);
}

function setView(v){
  if(!partOpen(cur.k, v)) v = (PARTS.find(([p]) => partOpen(cur.k, p)) || ["notes"])[0];
  view = v;
  app.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.v === v));
  $("#rounds").innerHTML = "";
  if(v === "notes") return notes();
  if(v === "quiz") return startQuiz();
  if(v === "exam") return exam();
  if(v === "past") return past();
  startCards();
}

function notes(){
  $("#stage").innerHTML = NOTES[cur.k].map(([h,t]) => `<div class="note"><h3>${h}</h3><p>${t}</p></div>`).join("") +
    (partOpen(cur.k,"quiz") ? `<div class="row"><button class="btn" id="toQuiz">Test yourself on this chapter</button></div>` : "");
  if($("#toQuiz")) $("#toQuiz").onclick = () => setView("quiz");
}

function startQuiz(){
  const pool = QUIZ[cur.k];
  deck = shuffle(pool); if(round) deck = deck.slice(0, round);
  i = 0; score = 0; misses = [];
  $("#rounds").innerHTML = `<span>Questions per round:</span>
    <button class="chip" aria-pressed="${round===10}" id="r10">10</button>
    <button class="chip" aria-pressed="${!round}" id="rAll">All ${pool.length}</button>
    ${weak(cur.k).length ? `<button class="chip" id="rWeak">My weak questions (${weak(cur.k).length})</button>` : ""}`;
  $("#r10").onclick = () => { round = 10; startQuiz(); };
  $("#rAll").onclick = () => { round = 0; startQuiz(); };
  if($("#rWeak")) $("#rWeak").onclick = () => { const w = weak(cur.k); deck = shuffle(QUIZ[cur.k].filter(x => w.includes(x.q))); i = 0; score = 0; misses = []; mode = "weak"; quiz(); };
  mode = round ? "round" : "all";
  quiz();
}

function bar(n){ return `<div class="bar"><i style="width:${n*100}%"></i></div>`; }

function quiz(){
  if(i >= deck.length) return result();
  const x = deck[i], order = shuffle(x.o.map((t,n)=>({t,n})));
  $("#stage").innerHTML = `<div class="card"><div class="meta ui">Question ${i+1} of ${deck.length}</div>${bar(i/deck.length)}
    <div class="q">${x.q}</div>
    <div class="opts">${order.map(o=>`<button class="opt" data-n="${o.n}">${o.t}</button>`).join("")}</div>
    <div id="why"></div><div class="row"><button class="btn" id="next" disabled>Next</button></div></div>`;
  answered = false;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if(answered) return; answered = true;
    const ok = +b.dataset.n === x.a; if(ok) score++; else misses.push(x);
    const w = weak(cur.k).filter(q => q !== x.q); if(!ok) w.push(x.q); setWeak(cur.k, w);
    document.querySelectorAll(".opt").forEach(o => { o.disabled = true; if(+o.dataset.n === x.a) o.classList.add("right"); });
    if(!ok) b.classList.add("wrong");
    $("#why").innerHTML = `<div class="why"><b class="ui">${ok ? "That's right." : "Not quite."}</b> ${x.w}</div>`;
    $("#next").disabled = false; $("#next").focus();
  });
  $("#next").onclick = () => { i++; quiz(); };
}

function result(){
  const pct = Math.round(score/deck.length*100), key = "hub-best-"+cur.k, best = +(store(key)||0);
  if(pct > best) store(key, String(pct));
  addHist(cur.k, {d: new Date().toISOString().slice(0,10), s: score, t: deck.length});
  send({chapter: "Chapter "+cur.n, score, total: deck.length, pct, mode, missed: misses.map(m => m.q)});
  const h = hist(cur.k).slice(-5);
  $("#stage").innerHTML = `<div class="card score"><div class="ui" style="color:var(--muted)">Chapter ${cur.n}: ${cur.title}</div>
    <div class="big">${score} / ${deck.length}</div>${h.length > 1 ? `<div class="ui" style="font-size:13px;color:var(--muted)">Your last ${h.length} rounds: ${h.map(r => Math.round(r.s/r.t*100)+"%").join(" &rarr; ")}</div>` : ""}
    <div>${pct >= 80 ? "Strong. Now try a worksheet problem under time." : pct >= 50 ? "Getting there. Go back over the ones you missed." : "Read the key points again, then try another round."}</div>
    <div class="row"><button class="btn" id="again">Another round</button>${misses.length ? `<button class="btn ghost" id="missed">Only the ones I missed</button>` : ""}</div>
    <div class="row"><button class="btn ghost" id="toNotes">Back to key points</button></div></div>`;
  $("#again").onclick = startQuiz;
  $("#toNotes").onclick = () => setView("notes");
  if(misses.length) $("#missed").onclick = () => { deck = shuffle(misses); i = 0; score = 0; misses = []; quiz(); };
}


function exam(){
  const items = PRACTICE[cur.k] || [];
  $("#stage").innerHTML = `<p class="ui" style="margin:0 0 12px;color:var(--muted);font-size:14px">Read the facts and the task. Jot your plan, then reveal what the answer must cover. Write it out in full under time when you can: about 70 minutes a question.</p>` +
   items.map((x,n) => `<div class="ex">
    <div class="src ui">${x.src}</div><div class="also ui">${x.also}</div>
    <div class="lab ui">The facts</div><div>${x.facts}</div>
    <div class="lab ui">The task</div><div class="task">${x.task}</div>
    <div class="lab ui">Your plan</div><textarea aria-label="Your plan" placeholder="Issues, law, documents, advice..."></textarea>
    <div class="row"><button class="btn" data-n="${n}">Show what the answer must cover</button></div>
    <div id="reveal${n}" hidden>
      <div class="lab ui">What the answer must cover</div><ul>${x.cover.map(c=>`<li>${c}</li>`).join("")}</ul>
      <div class="lab ui">Common errors</div><ul class="errs">${x.errors.map(c=>`<li>${c}</li>`).join("")}</ul>
      ${x.note ? `<div class="noteline">${x.note}</div>` : ""}
    </div></div>`).join("");
  $("#stage").querySelectorAll("button[data-n]").forEach(b => b.onclick = () => {
    const r = $("#reveal"+b.dataset.n); r.hidden = !r.hidden;
    b.textContent = r.hidden ? "Show what the answer must cover" : "Hide";
  });
}

function past(){
  const sets = (typeof PAST !== "undefined" && PAST[cur.k]) || [];
  $("#stage").innerHTML = `<p class="ui" style="margin:0 0 12px;color:var(--muted);font-size:14px">The quizzes and worksheets from the seminar, with the answers. Write your own answer first, then check it.</p>` +
   sets.map((s,si) => s.html ? `<div class="ex"><div class="src ui">${s.title}</div><div class="also ui">${s.sub}</div>
    <div class="noteline" style="font-style:normal;margin:6px 0 4px">${s.intro}</div>
    <div class="row"><button class="btn" data-doc="d${si}">Show model answers</button></div>
    <div class="doc" id="d${si}" hidden>${s.html}</div></div>` : `<div class="ex"><div class="src ui">${s.title}</div><div class="also ui">${s.sub}</div>
    <div class="noteline" style="font-style:normal;margin:6px 0 4px">${s.intro}</div>
    ${s.items.map((x,n) => `<div class="pq"><div class="lab ui">Question ${n+1}${x.m ? ` <span style="font-weight:400">[${x.m} mark${x.m>1?"s":""}]</span>` : ""}</div><div>${x.q}</div>
      <button class="chip pqb" data-id="pa${si}-${n}" style="margin-top:8px">Show answer</button>
      <div class="why" id="pa${si}-${n}" hidden>${x.a}</div></div>`).join("")}
    </div>`).join("");
  $("#stage").querySelectorAll("button[data-doc]").forEach(b => b.onclick = () => {
    const r = $("#"+b.dataset.doc); r.hidden = !r.hidden; b.textContent = r.hidden ? "Show model answers" : "Hide model answers";
  });
  $("#stage").querySelectorAll(".pqb").forEach(b => b.onclick = () => {
    const r = $("#"+b.dataset.id); r.hidden = !r.hidden; b.textContent = r.hidden ? "Show answer" : "Hide answer";
  });
}

function startCards(){ deck = shuffle(CARDS[cur.k]); i = 0; card(); }

function card(){
  const x = deck[i];
  $("#stage").innerHTML = `<div class="meta ui">Card ${i+1} of ${deck.length}</div>${bar((i+1)/deck.length)}
    <div class="flip" id="flip" tabindex="0" role="button" aria-label="Flip card"><div class="inner">
      <div class="face"><div class="q" style="margin:0">${x.f}</div><div class="hint ui">Tap to see the answer</div></div>
      <div class="face back"><div style="font-size:18px;line-height:1.55">${x.b}</div><div class="hint ui">Tap to flip back</div></div>
    </div></div>
    <div class="row"><button class="btn ghost" id="prev" ${i===0?"disabled":""}>Back</button><button class="btn" id="nxt">${i===deck.length-1?"Shuffle and start over":"Next"}</button></div>`;
  const f = $("#flip"), t = () => f.classList.toggle("on");
  f.onclick = t; f.onkeydown = e => { if(e.key===" "||e.key==="Enter"){ e.preventDefault(); t(); } };
  $("#prev").onclick = () => { if(i>0){ i--; card(); } };
  $("#nxt").onclick = () => { if(i < deck.length-1){ i++; card(); } else startCards(); };
}

function route(){ const k = location.hash.replace("#",""); if(k) { view = "notes"; chapter(k); } else home(); window.scrollTo(0,0); }
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
