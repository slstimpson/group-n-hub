<script>

};

const partOpen = (k, p) => (OPEN[k] || []).includes(p);
// The master revision bank is added and this set to true in revision season.
const REVISION_OPEN = false;

const CHAPTERS = [
 {k:"ch1", n:1, title:"Estates and Interests in Land", c:"#B5555B", l:"#F6E3E4"},
 {k:"ch3", n:3, title:"Registered Title", c:"#3E8E8A", l:"#DDEFEE"},
 {k:"ch4", n:4, title:"Transmission", c:"#6A5BA8", l:"#EAE7F6"},
 {k:"ch5", n:5, title:"Lost, Destroyed or Stolen Titles", c:"#B8962E", l:"#F7F0D9"},
 {k:"ch6", n:6, title:"Caveats", c:"#2A7F8E", l:"#E6F2F4"},
 {k:"ch7", n:7, title:"Sale of Interests in Land", c:"#C47A2C", l:"#F8EAD8"},
 {k:"ch8", n:8, title:"Mortgages", c:"#1F3A5F", l:"#DCE6F2"},
 {k:"ch9", n:9, title:"Restrictive Covenants", c:"#3C8D4F", l:"#E3F1E5"}
];

// Key points, drawn from the Group N handouts
const NOTES = {
 ch1: [
  ["Start every problem with three questions", "What estate does each person hold? Does it give possession now, or later in remainder or reversion? Is it legal or equitable? Nobody but the Crown owns land. A person owns an estate: rights in the land measured by time."],
  ["The estates", "Fee simple: lasts indefinitely, treated as permanent ownership. Fee tail (\"to A and the heirs of his body\"): passes only to lineal descendants and can't be left by will. Life estate (\"to A for life\"): nothing is left to pass on death. Estate pur autre vie: measured by someone else's life. It also arises when a life tenant transfers her interest. Leasehold: exclusive possession for a fixed and certain term."],
  ["\"Until\" or \"provided that\"?", "Words of duration (\"until\", \"during\", \"for so long as\") make a determinable estate, which ends automatically. Words of condition (\"provided that\", \"on condition that\", \"but if\") make a conditional estate, which continues until the grantor re-enters. Quote the words in your answer and say what they create."],
  ["Remainder and reversion", "A reversion is what the grantor keeps. A remainder is what a third person takes after the prior estate. Both are present interests: they can be sold, given or left by will today. If the remainderman dies first, his remainder passes under his will or on intestacy."],
  ["Legal and equitable", "A legal estate binds the world. An equitable interest binds everyone except a bona fide purchaser of the legal estate for value without notice. He must show four things: legal estate, value, good faith, no notice. Notice can be actual, constructive or imputed through his attorney."],
  ["How equitable interests arise", "Behind a trust. Where formalities weren't met: Walsh v Lonsdale (agreement for a lease), deposit of title deeds, part performance (Steadman v Steadman). Where equity creates them: restrictive covenants and proprietary estoppel (assurance, reliance, detriment: Inwards v Baker)."],
  ["The seven questions, in order, with sections", "1. Is there a settlement (s.2(2), s.2(4), s.65)? 2. Who is the tenant for life (s.2(6), s.2(7), s.64)? 3. What can she do (sell and exchange s.3, lease s.8, mortgage only under ss.20 and 21, contract s.37, convey s.23)? 4. Who are the trustees (s.2(9), s.44(1), s.46)? 5. What must she do first (a month's notice by registered post to each of at least two trustees and their attorney, s.53)? 6. On what terms (best price s.6(1), best rent s.10(2), acting as trustee s.59)? 7. Where does the money go (two trustees or into court, income only to her, ss.25, 47 and 24(2))?"],
  ["Leases by a tenant for life", "Up to 21 years generally, 60 for mining, 99 for building (s.8). By deed, in possession within twelve months, with a covenant for rent and a right of re-entry (s.10). A lease of three years or less may be in writing (s.9). Rent is income and belongs to her (Re Wix). A fine is capital."],
  ["Overreaching", "On a sale the purchaser takes the fee simple free of the settlement. The interests leave the land and attach to the money in the trustees' hands. The remainderman may never get the land. He gets the fund when the life interest ends (ss.23(2) and 25(5))."],
  ["Rules a settlor can't draft around", "The powers can't be assigned or released (s.56(1)). A contract not to use them is void (s.56(2)). A term that forbids, discourages or penalises their use is void to that extent (s.57, Re Paget's Settled Estates). Using a power causes no forfeiture (s.58)."],
  ["If you act for the purchaser", "Pay the trustees and have them join to give a receipt, which is a full discharge (s.48). A purchaser in good faith needn't ask whether notice was given (ss.53(3) and 60). A purchaser who knows the power is being misused isn't protected (Chandler v Bradley) and may decline to complete (Hatten v Russell)."],
  ["How a settlement is created", "By direct grant (\"to A for life with remainder to B\") with a deed appointing trustees \"for the purposes of the Settled Land Act\". Through a trust instrument. By will, ideally with an appointment clause using those words. By operation of law, when an infant becomes entitled in possession (ss.65 and 66)."],
  ["Reading a title that shows a settlement", "\"... for the term of her natural life and thereafter to [names] ...\". The first name is the tenant for life. The names after \"thereafter\" hold the remainder. \"Share and share alike\" makes them tenants in common. No words of severance makes them joint tenants. The title won't name the trustees: ask for the will or deed of appointment."],
  ["Cases to know", "Jacas v Jacas (life tenant's exclusive possession; remaindermen wait). Middlemas v Stevens (powers used in good faith for the settlement). Wheelwright v Walker (best price). Chandler v Bradley and Hatten v Russell (purchasers who know of misuse). Re Paget's (terms cutting down powers are void). Re Wix (rent is income)."],
  ["Exam checklist", "Classify first. Quote the words of the gift. Run the seven questions with sections. Say where the money goes. Give practical advice: valuation, advertisement, court application for trustees, timing of notice, what goes on the title. Write for the reader the question names: plain words for a lay client, authority for a supervising attorney."]
 ],
 ch3: [
  ["The whole system in one idea", "The State keeps a book, writes in it who owns each piece of land, promises the book is right and pays if it's wrong. Gibbs v Messer: the point is to save a buyer the trouble of going behind the register."],
  ["Mirror, curtain, insurance", "Mirror: the Register shows everything that matters about ownership and burdens (ss.68 and 70). Curtain: it's the only place you need to look (s.71). Insurance: the assurance fund pays an innocent person who loses out (ss.158 and 161 to 164)."],
  ["The golden rule", "Signing does nothing. Title passes when the Registrar registers the instrument (ss.59, 63 and 88). Until then the buyer has a contract and a claim to be registered. If two instruments are lodged, the one registered first wins, whatever date it was signed."],
  ["The Register and the two certificates", "The original is bound in the Register Book at the National Land Agency. The duplicate goes to the registered proprietor (ss.25 and 26). Volume and folio is the title reference that every search, caveat and instrument quotes."],
  ["Absolute and qualified title", "Absolute (s.26): owner subject only to the burdens written on the certificate. Qualified (s.27): first registration where the proof is good but not perfect. Same estate, with a warning written on. It can be upgraded later."],
  ["Indefeasibility and its gaps", "Frazer v Walker: indefeasibility is immunity from older claims, not a promise that nothing can touch the owner. The gaps: fraud, adverse possession, the overriding interests in s.70, anything written on the certificate and personal claims against the owner himself."],
  ["What the certificate doesn't tell you", "Who's living there (go and look). Instruments and caveats lodged but not yet endorsed (get a search certificate, s.144). Trusts (never on the title, s.60). The s.70 interests: public rights of way, easements by long use, unpaid tax and water rates, a tenant under a lease of three years or less. Whether a part-of-land transfer has subdivision approval."],
  ["Searching", "Anyone may search on paying the fee (s.76), but not the papers lodged with a first registration (s.42). A search certificate (s.144) catches caveats, lodged instruments, orders and injunctions not yet on the title. Search before contract. Get a search certificate before completion."],
  ["The fraud sections", "s.68: the certificate is conclusive evidence. s.70: subject to the listed burdens \"except in case of fraud\". s.71: a buyer isn't affected by notice of trusts or unregistered interests, fraud excepted. s.153: the Registrar may cancel an entry got by fraud. s.161: recovery of land from a registered owner only on a short list, including deprivation by fraud. s.178: false declarations are an offence and the title is void against those in on it."],
  ["What fraud means", "Actual dishonesty by the registered owner or his agent (Assets Co v Mere Roihi; Butler v Fairclough; Waimiha Sawmilling; Carty v McPherson). Not carelessness. Deliberately not asking when you suspect something can be fraud. Lodging a forged document you honestly believe genuine isn't. Arem v Myrie: the judge had to find Mrs Myrie knew. Sue v Peart: a title got by false declarations was cancelled."],
  ["After a fraud", "While the fraudster is on the Register, the victim can have it corrected. Once he sells to a bona fide purchaser for value without notice who registers, that buyer's title is indefeasible. The victim sues the fraudster or claims from the assurance fund."],
  ["Bringing land under the Act", "Who may apply (s.28). The application before a JP, with the land described by metes and bounds or plan (s.30), its value, occupiers, adjoining owners and burdens. The applicant's declaration of possession, two declarations from independent people who have known the land thirty years, the deeds or receipts, a pre-checked plan with the surveyor's declaration, a tax certificate and fees."],
  ["The first registration process", "Survey check, then the Referee of Titles. Provisional approval, advertisement in the Gazette and a newspaper, notice to adjoining occupiers (s.33). Caveats within the notice period (s.43) lapse a month after lodging unless proceedings start or an injunction is served (ss.44 and 45). Then registration (s.37), usually about seven weeks after the first advertisement."],
  ["Adverse possession", "Twelve years defeats the paper owner (ss.85 to 87; Limitation of Actions Act ss.3 and 30). Prove factual possession and the intention to possess (Wills v Wills; Pottinger v Raffone). Permission is fatal (Ramnarace v Lutchman). One joint tenant's licence binds all (Sarju v Sarju). The Referee may still ask for thirty years where the old owner can't be found, though Hall and Pitter says twelve is enough absent disability."],
  ["Lessons from Sarju and Sue v Peart", "What a client swears at the Titles Office can be used against him for life. Find out how he got onto the land before lodging anything. A caveat protects an existing interest. A bare licensee has none. Know the Notice to Caveator timetable (s.140(2))."],
  ["Instruments", "Prescribed forms, not deeds. Transfer (s.88). Mortgage as a charge (s.103), discharged by endorsement. No trusts on the Register (s.60): transfer to the trustees and sign a separate declaration of trust, which may be deposited with the Registrar. Since 2020 the Registrar must lodge a caveat to protect a declaration of trust (s.15(d)). Stamp duty and transfer tax first (s.176; Transfer Tax Act s.33)."],
  ["Signing and witnessing (s.152)", "By hand in ink, names matching the title. In Jamaica before a JP, judge, the Registrar, a notary, the Governor-General or an attorney-at-law. Abroad before the officials the Act lists, or a notary with a certificate of commission. Any other witness must complete the probate clause before one of them. Powers of attorney must be deposited first (ss.149 to 151). Companies sign under s.127."],
  ["Why the Registrar sends a transfer back", "Name doesn't match the title. Company struck off. Transferor a child or of unsound mind. Description doesn't match. No consideration. Two transferees without saying how they hold. Undeposited power of attorney. A caveat, order or mortgage on the title not dealt with. 100 acres or more without consent. No transfer tax certificate."],
  ["Selling part of a lot", "Subdivision approval under the Local Improvement Act must accompany any part-of-land dealing. Routes: a pre-checked part-of-land plan and TR2 transfer producing a splinter title, or a deposited subdivision plan and surrender (ST1), or lot-by-lot transfers against the deposited plan."],
  ["The 2020 amendment: what changed", "The Registration of Titles (Amendment) Act 2020 is read with the main Act. Five changes matter for this course: the Registrar's caveat in s.15(d), registration without the Referee in s.28A, taxes proved at provisional approval in s.29(2), a nominee on an adverse possession title in s.87A and a tougher s.178."],
  ["Registration without the Referee (s.28A)", "Title can issue without reference to the Referee of Titles on (a) a Certificate of Compliance under the Facilities for Titles Act, (b) an adjudication certificate under the Special Provisions Act or (c) a court order deciding ownership. For (a) and (c) the Registrar serves notice on adjoining and registered owners and the applicant advertises once a week for two weeks; title may issue 21 days after the last advertisement. The Registrar decides the supporting documents (s.28B)."],
  ["Taxes on first registration (s.29(2))", "The applicant no longer has to prove taxes paid when applying. Once provisional approval is granted, he proves that quit rents and property taxes are paid up to the date of the approval."],
  ["Registrar's caveat (s.15(d))", "The Registrar must lodge a caveat in two cases: to protect a declaration of trust or to protect a charge for unpaid property taxes on an application made on an adjudication certificate under s.28A(1)(b). He may also enter a caveat on a transmission (s.130(3)). Outside those, protection is by the claimant's own caveat under s.139."],
  ["False declarations (s.178)", "Procuring a registration by a false declaration is an offence, with a fine of up to $1 million before a Parish Judge or, in default, up to six months in prison. Any certificate, entry, erasure or alteration got by the fraud is void against everyone party or privy to it. Sue v Peart shows it working."],
  ["Nominees (s.87A) and unpaid balances (s.155)", "An adverse possession applicant may direct that the title issue to a nominee who consents; taxes apply. Under s.155(2) to (6) a purchaser who still owes part of the price may pay it to the Accountant General, advertise for two weeks and apply for a vesting order six weeks after the first advertisement."]
 ]
};

const QUIZ = {
 ch1: [
  {q:"What's the largest estate known to the law?", o:["Fee tail","Fee simple absolute in possession","Life estate","Leasehold"], a:1, w:"It's treated as equivalent to permanent ownership."},
  {q:"\"To Fred and the heirs of his body\" creates what?", o:["A fee simple","A fee tail","A life estate","A determinable fee"], a:1, w:"\"Heirs of his body\" confines descent to lineal descendants."},
  {q:"A life tenant leaves everything by will. What passes under the will from her life estate?", o:["The fee simple","Her life estate","Nothing","Half the land"], a:2, w:"A life estate ends on the holder's death. There's nothing left for the will to pass."},
  {q:"\"For so long as it is used as a school\" creates what?", o:["A conditional fee simple","A determinable fee simple","A fee tail","A lease"], a:1, w:"Words of duration mark the limit of the estate. It ends automatically when the use stops."},
  {q:"Michelle grants Joe a life interest and nothing more. Joe transfers it to Marsha and later dies. Who's entitled now?", o:["Marsha","Joe's estate","Michelle","The Crown"], a:2, w:"Marsha held an estate pur autre vie measured by Joe's life, which ended at his death. Michelle kept the fee simple in reversion."},
  {q:"Adam grants Eve a life interest with remainder to Jacob. Jacob dies first. What happens to his remainder?", o:["It's lost","It passes under Jacob's will or to his next of kin","It goes to Eve","It goes back to Adam"], a:1, w:"A vested remainder is a present interest. Whoever takes it gets possession when Eve dies."},
  {q:"Can a tenant for life sell the fee simple?", o:["No, only her own life interest","Yes, under the Settled Land Act s.3","Only with the remaindermen's consent","Only with a court order"], a:1, w:"At common law she could sell only her life interest. The Act gave her power over the fee simple."},
  {q:"On a sale of settled land, who receives the purchase money?", o:["The tenant for life","The remaindermen","At least two trustees of the settlement, or the court","The buyer's bank"], a:2, w:"Sections 25 and 47. Never the tenant for life."},
  {q:"How much notice must the tenant for life give the trustees before selling?", o:["None","A week","At least one month, by registered post, before the sale or the contract","Six months"], a:2, w:"Section 53. A life tenant who signs an agreement for sale first is already in breach."},
  {q:"Can the trustees of the settlement veto a sale?", o:["Yes","No. They receive notice and the money and can go to court","Only if the price is low","Only if the remaindermen object"], a:1, w:"Notice isn't consent. Their remedy is an application to court under s.52."},
  {q:"A will names executors and trustees but says nothing about the Settled Land Act or a power of sale over the land. Are they trustees of the settlement?", o:["Yes, automatically","No. Without those words, apply to court under s.44","Only if they agree","Only for leases"], a:1, w:"Section 2(9) needs a power of sale or a declaration that they're trustees for the purposes of the Act."},
  {q:"For what can a tenant for life mortgage the fee simple?", o:["Any purpose","Raising equality money on an exchange or partition, or paying off an incumbrance","Her own living expenses","Buying another home"], a:1, w:"Sections 20 and 21. She can charge her own life interest, but that's poor security."},
  {q:"What's the longest lease a tenant for life may grant for an ordinary purpose?", o:["7 years","21 years","60 years","99 years"], a:1, w:"Section 8: 21 years generally, 60 for mining and 99 for building. A lease must be by deed (s.10), except a lease of three years or less (s.9)."},
  {q:"A will says the widow's life interest ends if she stops living in the house. Can that stop her selling?", o:["Yes","No. A term that discourages use of the statutory powers is void to that extent","Only if the remaindermen object","Only for a year"], a:1, w:"Section 57. Re Paget's Settled Estates."},
  {q:"A buyer purchases the legal estate for value with no notice of a trust. What happens to the beneficiary's interest in the land?", o:["It binds the buyer","It's defeated, leaving a personal claim against the trustee","It becomes a mortgage","It passes to the Crown"], a:1, w:"The bona fide purchaser of the legal estate for value without notice takes free of equitable interests."},
  {q:"A father encourages his son to build on the father's land. The father dies leaving it to others. What protects the son?", o:["Nothing","Proprietary estoppel","Adverse possession","The Settled Land Act"], a:1, w:"Inwards v Baker: assurance, reliance and detriment."}
 ],
 ch3: [
  {q:"The seller and buyer sign the transfer and the buyer pays. Is the buyer now the legal owner?", o:["Yes","No. Title passes on registration","Yes, once stamped","Yes, once the keys are handed over"], a:1, w:"RTA ss.59, 63 and 88."},
  {q:"Which Torrens principle means nobody needs to look behind the Register?", o:["Mirror","Curtain","Insurance","Overreaching"], a:1, w:"Mirror: the Register reflects the facts. Insurance: the State compensates if it's wrong."},
  {q:"The Register is wrong and someone loses out. Where does compensation come from?", o:["The Registrar personally","The assurance fund","The buyer's insurer","Nowhere"], a:1, w:"RTA ss.158 and 161 to 164."},
  {q:"What's a qualified title?", o:["A title issued to an attorney","A first title issued where the title is imperfect, subject to the qualifications endorsed","A title with a mortgage on it","A title to Crown land"], a:1, w:"RTA s.27. It can later be upgraded to absolute."},
  {q:"Which of these is not an exception to indefeasibility?", o:["Fraud","Adverse possession","The s.70 interests","The owner bought below market value"], a:3, w:"The other gaps include interests endorsed on the title and personal claims against the owner."},
  {q:"What does a search certificate do that a plain search doesn't?", o:["Nothing more","It certifies whether the owner is free to deal, catching caveats and pending instruments","It guarantees the boundaries","It transfers the title"], a:1, w:"Section 76 against s.144."},
  {q:"Which of these binds a buyer even though it's not on the certificate?", o:["An unregistered ten-year lease","A tenant in possession under a lease of three years or less","An unregistered mortgage","An oral option to buy"], a:1, w:"RTA s.70."},
  {q:"An applicant for first registration has no deeds. How long must possession of private land usually be?", o:["5 years","12 years","20 years","60 years"], a:1, w:"Limitation of Actions Act s.3. Crown land needs 60."},
  {q:"Sunny has lived on the lot for 20 years with the permission of one of three joint tenants. Can he get title by adverse possession?", o:["Yes","No. Possession with permission is never adverse and one joint tenant's licence binds all","Only if he paid the taxes","Only with all three owners' consent"], a:1, w:"Sarju v Sarju [2022] JMSC Civ 126."},
  {q:"What is a registered mortgage of land in Jamaica?", o:["A transfer of the fee simple with a right to redeem","A charge on the land","A lease to the lender","A caveat"], a:1, w:"RTA s.103. A transfer with a right to redeem is the common law mortgage of unregistered land."},
  {q:"Before whom can an instrument be signed for the Registrar to accept it?", o:["Any adult","A JP, a notary public or an attorney-at-law, among others","Only a judge","Only the Registrar"], a:1, w:"RTA s.152."},
  {q:"A transfer is signed on 1 March and lodged on 10 March. A mortgage is signed on 5 March and lodged on 8 March. Which has priority?", o:["The transfer","The mortgage","Neither","Whichever is stamped first"], a:1, w:"Priority follows lodgement and registration."},
  {q:"What counts as fraud under the RTA?", o:["Any mistake on the title","Carelessness","Actual dishonesty by the registered owner or the owner's agent","Paying too little"], a:2, w:"Assets Co v Mere Roihi [1905] AC 176."},
  {q:"In Arem v Myrie, why wasn't a forged signature enough on its own?", o:["Forgery isn't fraud","The court also had to find the registered owner knew it was forged","The forgery was too old","The title was lost"], a:1, w:"An innocent owner who registers a forged transfer isn't guilty of fraud under the Act."},
  {q:"A fraudster sells to an innocent buyer who registers. What can the original owner get from the State?", o:["Nothing","Compensation from the assurance fund","The land back","A new title"], a:1, w:"The innocent buyer's title is indefeasible. The original owner can also sue the fraudster."},
  {q:"After the Referee provisionally approves a first registration, how can someone object?", o:["They can't","By lodging a caveat within the time in the advertised notice","By letter to the neighbours","Through the parish council"], a:1, w:"RTA ss.33 and 43. The caveat lapses after a month unless proceedings start (ss.44 and 45)."}
 ]
};

  {q:"Lisa is life tenant of a bungalow. Karen, the remainderman and executrix, moves her boyfriend in and tells Lisa to leave. What's Lisa's position?", o:["Karen is entitled as remainderman","Lisa is entitled to exclusive possession for her life. Karen must wait","They share possession","The executrix decides"], a:1, w:"Jacas v Jacas [2017] JMSC Civ 77: remaindermen, including one who was an executor, were kept out. (August 2025 Q3)"},

  {q:"A remainderman aged 14 is entitled under the will. Does his consent matter to a proper sale by the life tenant?", o:["Yes. Nothing can happen until he's 18","No. His consent isn't needed, but the life tenant acts as his trustee","His guardian must consent","The court must consent"], a:1, w:"Section 59. If he became entitled in possession while a minor, the land would be deemed settled and the trustees would act (ss.65 and 66)."}

  {q:"Which of these lets the Registrar issue a title without reference to the Referee of Titles?", o:["A statutory declaration of twelve years' possession","An adjudication certificate under the Special Provisions Act","A pre-checked survey plan","A search certificate"], a:1, w:"RTA s.28A(1), added in 2020: a Certificate of Compliance under the Facilities for Titles Act, an adjudication certificate or a court order deciding ownership."},
  {q:"An applicant to bring land under the Act asks when he must prove his property taxes are paid. What do you tell him?", o:["With the application","Once provisional approval is granted, up to the date of the approval","Only if the Referee asks","After the title issues"], a:1, w:"RTA s.29(2), added in 2020. The old requirement to prove taxes paid up to the date of the application was removed from s.29(1)."},

  {f:"Frazer v Walker [1967] 1 AC 569", b:"Indefeasibility is immunity from older claims, not a promise that nothing can touch the owner. Personal claims survive."},
  {f:"RTA s.60", b:"No trusts on the Register. Transfer to the trustees and sign a separate declaration of trust."},
  {f:"RTA s.178", b:"A false declaration to get a title is an offence. The title is void against those in on it."},
  {f:"Wills v Wills and Pottinger v Raffone", b:"Adverse possession needs factual possession and an intention to possess to the exclusion of everyone, the paper owner included."},
  {f:"Plain words: \"splinter title\"", b:"The new title carved off the parent title for the piece of land sold."},
  {f:"Plain words: \"probate clause\"", b:"The official's note confirming the signing, needed when an ordinary person witnessed the signature."},
  {f:"Probate but no transmission", b:"The deceased is still the registered owner. Nobody can give a mortgage or transfer until transmission is registered."},
  {f:"Registered owner holding land someone else paid for", b:"He can sell to an innocent buyer who'll take free of the claim. Lodge a caveat at once."},
  {f:"Buyer from a mortgagee registers", b:"Protected unless party to fraud or collusion. The borrower's remedy is damages against the mortgagee."},
  {f:"Owner abroad finds someone else on the title", b:"Search, lodge her own caveat with a statutory declaration, then sue for a declaration and cancellation (ss.139, 153 and 161). A Registrar's caveat under s.15(d) doesn't cover her case."},
  {f:"\"Client believes it's a strata unit\"", b:"Verify. Search the Register and get a search certificate before contract."},
  {f:"Common law title, long possession, bank wants registered title", b:"Apply to bring the land under the Act. Referee, advertisement, caveat window, then title."}
 ]
};

 { title: "Progress quiz", sub: "Homework after Seminar 1. 40 marks. Open statute, closed notes, 60 minutes.",

   { q: "Name the Act under which land is registered in Jamaica and the official who keeps the Register.",

   { q: "True or false: when the vendor and purchaser sign the instrument of transfer and the purchaser pays, the purchaser becomes the legal owner of registered land.",
     a: "<b>False.</b> Title passes on registration (RTA ss.59, 63, 88). Until the transferee is entered, the transferor remains proprietor." },
   { q: "What are the three principles of the Torrens system? One line each.",
     a: "<b>Mirror:</b> the Register reflects accurately and completely the facts material to proprietorship.<br><b>Curtain:</b> the Register is the sole source; nobody need look behind it.<br><b>Insurance:</b> if the Register is wrong and someone suffers loss, the State compensates (assurance fund, RTA ss.158, 161 to 164)." },
   { q: "What is the difference between a certificate of absolute title and a certificate of qualified title?",
     a: "<b>Absolute (s.26):</b> the named person is proprietor subject to the encumbrances noted.<br><b>Qualified (s.27):</b> issued on first registration where the title is imperfect. Same estate, but subject to the qualifications endorsed. It can be upgraded to absolute on application." },
   { q: "A registered proprietor's title is said to be \"indefeasible\". Name two exceptions.",
     a: "Any two of: fraud; adverse possession for twelve years or more; the overriding interests in s.70 (public rights of way, easements by user, unpaid taxes and rates, short tenancies); interests endorsed on the title; claims in personam against the proprietor." },
   { q: "What is the difference between a search of the Register and a search certificate?",
     a: "A <b>search</b> (s.76) is an inspection of the Register Book and registered instruments by anyone who pays the fee. A <b>search certificate</b> (s.144) is the Registrar's certificate whether the proprietor is free to deal with the land, taking account of caveats and instruments lodged but not yet registered, as well as orders and injunctions known to the Registrar but not yet on the certificate." },
   { q: "Name three things that bind registered land even though they do not appear on the certificate of title.",
     a: "Any three from RTA s.70: public rights of way; easements acquired by user; unpaid property taxes and water rates; a tenant in possession under a lease of three years or less." },
   { q: "Who may apply to bring unregistered land under the Act? Name two categories.",
     a: "Any two from RTA s.28: a person claiming to own the fee simple at law or in equity; the Commissioner of Lands for Crown land; a guardian of an infant or committee of a person of unsound mind; a tenant for life exercising a power of sale; a mortgagor with the mortgagee's consent; a mortgagee exercising a power of sale; a vendor of common law title at the purchaser's request (s.49)." },
   { q: "An applicant for first registration has no deeds. For how many years must he show possession, and why does the answer vary?",
     a: "Twelve years extinguishes the owner's right (Limitation of Actions Act s.3), but the applicant must prove the former owner's title and that it has been extinguished. Where the former owner can't be identified the Referee has required thirty years, because ss.17 and 19 extend time for an owner under a disability up to thirty years. Hall and Pitter v Registrar of Titles [2016] JMSC Civ 203 says twelve years suffices absent evidence of disability." },
   { q: "Sunny lives on Lot 5 with the permission of his uncle, one of three registered joint tenants. After twenty years he applies for title by adverse possession. Will he succeed? One sentence.",
     a: "<b>No.</b> He entered with permission, so his possession was never adverse; and a licence from one joint tenant is treated as a licence from all (Sarju v Sarju [2022] JMSC Civ 126)." },

     a: "<b>(b).</b> A registered mortgage takes effect as a charge (RTA s.103), which is why it is discharged by endorsement and not by reconveyance. A common law mortgage of unregistered land in Jamaica is (a)." },

 { title: "Progress quiz", sub: "Homework after Seminar 3. 50 marks: Part A 24, Part B 26.",

     a: "Actual fraud, \"dishonesty of some sort\", by the proprietor or his agent: Assets Co v Mere Roihi [1905] AC 176 (Lord Lindley). See also Butler v Fairclough, Waimiha Sawmilling v Waione Timber and Carty v McPherson [2020] JMSC Civ 74 paras 50 to 53. Carelessness is not fraud. Deliberately not asking when suspicions are aroused can be." },
   { q: "In Arem v Myrie the judge did not stop at finding the signature forged. What further finding did she need, and why?", m: 2,
     a: "That Mrs Myrie knew the signature was forged. The fraud exception in ss.70 and 161 needs dishonesty by the registered proprietor or her agent. An innocent proprietor who registers a forged transfer believing it genuine is not guilty of fraud under the Act (Assets Co), so the forgery alone would not have defeated her title." },
   { q: "In Sue v Peart, what was the contradiction between the story told to the Registrar and the story told in court, and which sections of the RTA did the court rely on to cancel the title?", m: 2,
     a: "<b>To the Registrar:</b> undisturbed possession as owner since 1996, supported by declarations from relatives, with no mention of a tenancy or a purchase.<br><b>In court:</b> a tenant from 2003 who bought the land for US$10,000 in 2014. He admitted the declarations were false.<br><b>Sections:</b> 68, 70 (fraud exception), 153 (Registrar's power to cancel), 161 (action by a person deprived by fraud) and 178 (false declarations; the certificate is void against parties and privies). The court declared the title fraudulently obtained and directed cancellation and restoration." },
   { q: "A fraudster registered as proprietor sells to an innocent purchaser for value who registers. What are the original owner's remedies against (a) the purchaser, (b) the fraudster and (c) the State?", m: 2,
     a: "<b>(a)</b> None to recover the land. The purchaser's registered title is indefeasible (s.71; Gibbs v Messer) unless the purchaser was party or privy to the fraud.<br><b>(b)</b> Damages against the fraudster.<br><b>(c)</b> Compensation from the assurance fund under ss.158 and 161 to 164, subject to the conditions in those sections." },
   { q: "Adassa is executrix of her late father's estate. She has the grant of probate and has signed an agreement to sell his registered land. The purchaser's bank will not release the mortgage money, saying Adassa cannot give title. Is the bank right? What must happen before completion and in what order?", m: 2,
     a: "<b>The bank is right.</b> Title passes on registration, not on death or on the grant (RTA ss.59, 63 and 88). The search will show her father as registered proprietor, so Adassa cannot transfer until she is registered. She may sign the agreement before transmission but must be registered to complete.<br><b>The order:</b> (1) grant of probate; (2) application for transmission (her name, address and capacity, the land as described on the title, its value at death, her father's name and date of death and the grant), lodged first at the Stamp Office and then at the Titles Office (ss.130, 132 and 133); (3) transmission endorsed on the title, making her proprietor as executrix; (4) the transfer to the purchaser, stamped and registered, with the bank's mortgage registered after it.<br>A good answer also advises her to ask for an extension, or not to serve a notice making time of the essence, until she is ready, willing and able to complete. Putting the transfer before the transmission loses the marks." },
   { q: "Marlon has signed an agreement to buy a registered lot and paid a 10% deposit. The vendor now refuses to complete and has told Marlon he has \"another buyer\". Can Marlon lodge a caveat? State the interest he claims, what the caveat must contain and how it is lodged. Then set out the options open to the registered owner once the caveat is on the title.", m: 2,
     a: "<b>Yes.</b> A purchaser under a binding agreement for sale has an equitable interest in the land or, at the least, a lien for the deposit paid. Either is a caveatable interest (RTA s.139).<br><b>Contents:</b> the form in the Thirteenth Schedule (s.139); the caveator's name and addition, signed by him or his agent; an address in Kingston for service; a definite estate or interest (here, the purchaser's interest under the agreement, with its date, the price and the deposit paid); a copy of the agreement, because the claim rests on a document. If the Registrar requires it, a statutory declaration stating the nature of the title claimed.<br><b>Lodging:</b> at the Titles Office with the fee. The Registrar notifies the registered proprietor (s.140).<br><b>The owner's options, apart from court proceedings:</b> ask Marlon to withdraw; or apply to register a dealing, after which the Registrar gives Marlon notice and the caveat lapses fourteen days later unless, within that time, Marlon obtains an order from a Judge extending it on an undertaking, security or payment into court (s.140). The same person cannot renew a caveat for the same interest. If it was lodged without reasonable cause, the owner can claim compensation (s.143). The owner can also summon Marlon before a Judge to show cause why it should not be removed (s.140).<br>Marlon's own remedy is a claim for specific performance or the return of his deposit. The caveat only holds the position while he brings it." },
   { q: "Adassa (question 7) now finds that her father's duplicate certificate of title was stolen in a break-in. What must she do before she can complete the sale? Say where this step fits among the others in question 7.", m: 2,
     a: "Apply to the Registrar under s.82 to cancel the certificate and register a new certificate in duplicate. She proves the loss to the Registrar's satisfaction, usually by statutory declaration (when and how it was stolen, that it has not been pledged or deposited and that she has searched for it), supported by the police report, and complies with any requisitions. The Registrar gives at least fourteen days' notice in at least one newspaper (s.82(2)). If no sufficient cause is shown, he cancels the old certificate and duplicate and registers a new one. The application may be combined with one under s.81 to dispense with production of the duplicate, which is how a transmission can proceed while the replacement is pending.<br><b>Place in the order:</b> grant of probate, then transmission to Adassa as executrix, then the replacement duplicate title, then the transfer to the purchaser. In practice the transmission and the application for the replacement are often lodged together. Lost titles never come up alone in the exam. They sit inside an estate question, after probate and transmission." },
   { q: "Why was John Sarju's caveat doomed from the moment it was lodged? Identify the sentence in his own statutory declaration that did the damage.", m: 2,
     a: "Because it admitted he was a licensee. The declaration stated he was \"put in possession of the property by Arthur Sarju\" in 1986 under an oral agreement. Possession with permission is never adverse (para 21; Ramnarace v Lutchman). The permission of one joint tenant is the permission of all (paras 23 to 27). So there was no interest capable of supporting a caveat, and it lapsed after the Notice to Caveator in any event." },
   { q: "Your client wants to sell the back half of his registered lot to his neighbour. List the steps and documents before the Registrar will issue a title to the neighbour.", m: 2,
     a: "<ul><li>A commissioned surveyor prepares a part-of-land survey.</li><li>Pre-checked plan approved and certified by the Director of Surveys, with examination number and stamp.</li><li>Subdivision approval from the municipal corporation under the Local Improvement Act, with blueprint and release.</li><li>Surveyor's statutory declaration.</li><li>Agreement for sale.</li><li>TR2 part-of-land transfer in the prescribed form, stamped and noted for transfer tax (s.176; Transfer Tax Act s.33), executed and witnessed under s.152.</li><li>Duplicate parent title lodged.</li><li>The Registrar issues a splinter title to the neighbour and endorses the parent title.</li></ul>Alternative: deposit a subdivision plan and surrender under ST1." },
   { q: "A Jamaican proprietor in Toronto signs a transfer before a Canadian notary and sends it to you. What must be on the instrument for the Registrar to accept it? What if she had signed before her sister instead?", m: 2,
     a: "Her signature in ink before the notary; the notary's seal on the attestation; a certificate from the appropriate officer in Ontario that the notary is duly commissioned and practising and that full faith and credit may be given to his acts (s.152; NLA guidance). Canada is a Commonwealth country, so a judge, mayor or chief magistrate would also do. If she signed before her sister, the sister must appear before a prescribed functionary who completes the probate clause (date, place, that the witness saw her sign, sound mind, freely signed). Otherwise the Registrar will reject it." },
   { q: "<b>Problem 1.</b> Miss Brown owns a registered lot in St Elizabeth at Volume 1200 Folio 340. In 2009 she allowed her nephew Keith to build a shop at the front of the lot and live above it, telling him \"stay as long as you want, it will be yours one day\". She never put anything in writing. In 2020 she sold the whole lot to Mr Green for value; Mr Green visited once, saw the shop, asked no questions and registered his transfer. In 2026 Mr Green serves notice on Keith to leave. Keith says he has been there seventeen years, has paid the property tax since 2012 and wants to lodge a caveat and apply for title by adverse possession. Advise Keith on (a) whether he has a caveatable interest and on what basis, (b) whether an adverse possession application can succeed, (c) what, if anything, binds Mr Green and (d) what you would check before lodging any document at the Titles Office.", m: 14,
     a: "<b>(a) Caveatable interest (4).</b> A caveat protects an existing estate or interest (RTA s.139). Adverse possession gives Keith nothing: he entered with Miss Brown's permission and a licensee's possession is never adverse (Sarju v Sarju; Ramnarace v Lutchman). Paying property tax doesn't turn permission into adverse possession. His only arguable interest is an equity by proprietary estoppel: assurance (\"it will be yours one day\"), reliance and detriment (building the shop), on the Inwards v Baker pattern (Manual p. 36). That is an equitable interest capable of supporting a caveat and should be the basis stated in the caveat and declaration. Don't plead adverse possession in the declaration. It is untrue and it will be used against him (Sarju).<br><b>(b) Adverse possession (3).</b> No. Seventeen years of permissive occupation is not twelve years of adverse possession, and there is no evidence the permission was withdrawn before 2026.<br><b>(c) What binds Mr Green (4).</b> He is a registered purchaser for value. Under ss.70 and 71 he is not affected by notice of unregistered interests and need not enquire, fraud excepted. His visit and failure to ask about the shop is not fraud (Assets Co: not asking is fraud only where suspicions are aroused and the failure is dishonest). Keith is not a tenant for three years or less under s.70. So the estoppel equity, unregistered and uncaveated when Mr Green registered, is probably defeated against him and survives only in personam against Miss Brown (Frazer v Walker). An answer may argue the other way, that a purchaser who saw a man in occupation of a shop and asked nothing is bound in personam, but the better view is that absent fraud the registered title prevails.<br><b>(d) Checks before lodging (3).</b> How Keith got in and whether the permission ever ended; whether Miss Brown is alive and will give evidence; the title and a search certificate (any caveat, mortgage or pending dealing); whether Mr Green is the registered proprietor and when he registered; property tax receipts; photographs and dates of the building; whether a claim against Miss Brown or her estate, or in damages, is the realistic remedy. Then the fourteen-day period under s.140, so he is ready to go before a Judge before the caveat lapses." },
   { q: "<b>Problem 2.</b> Mrs Campbell lives in Florida and has not been to Jamaica since 2012. She holds the duplicate certificate of title for a house in Mandeville, Volume 1310 Folio 55, registered in her sole name. A friend has told her that \"someone else's name is now on the title\" and that a family is living in the house. She has never signed any transfer. Write a letter of advice setting out (a) the searches and enquiries in the first week and how you would make them lawfully, (b) the possible explanations for the entry and the section engaged by each, (c) the immediate protective step at the Titles Office and (d) the orders you would seek if the transfer proves to be forged, citing the authority.", m: 12,
     a: "<b>(a) Searches (3).</b> Search the Register and get a certified copy of the current certificate (s.76); a search certificate (s.144) to catch pending instruments and caveats; copies of the registered transfer, any power of attorney deposited under ss.149 to 151 and the Stamp Office noting. Check the Island Record Office for a recorded power of attorney and the property tax records. Instruct a surveyor or agent to inspect and identify the occupiers. Compare the signature on the transfer with her known signatures and, if it isn't hers, instruct a forensic document examiner (Arem v Myrie). All of this is public search or inspection with the client's authority. No pretexting of the occupiers or the registry.<br><b>(b) Explanations (3).</b> A forged transfer: s.70 fraud exception and s.161 if the transferee was party to it (Arem v Myrie). A transfer under a power of attorney she never gave (ss.149 to 151). A title by adverse possession on false declarations (ss.85 to 87; Sue v Peart; s.178). A mortgagee's sale under a mortgage she never gave (ss.105 to 109). A Registrar's error (s.153; assurance fund ss.158 and 161 to 164). A transmission on a false declaration of her death (ss.130, 132 and 133).<br><b>(c) Protective step (3).</b> Lodge a caveat forbidding all dealings (s.139) with a statutory declaration that she is the true owner and never executed any transfer, so the fraudster can't sell on to a bona fide purchaser, whose title would then be indefeasible against her. A Registrar's caveat under s.15 isn't the answer: s.15(d), added in 2020, covers only a declaration of trust or a charge for unpaid property taxes on an application under s.28A(1)(b). You may ask the Registrar to use his s.15 powers to summon and examine the transferee. Diarise the fourteen-day period under s.140 and be ready to go before a Judge.<br><b>(d) Orders (3).</b> A declaration that the transfer was forged and the title obtained by fraud; rescission of the transfer; delivery up of the duplicate title to the Registrar of the Supreme Court for the Registrar of Titles; an order that the Registrar cancel the endorsement and, in default of delivery, cancel the certificate and issue a new one in her name (s.153 and s.161); an injunction restraining dealings and, if appropriate, recovery of possession against the occupiers; costs. Authority: Arem v Myrie [2018] JMSC Civ 49 (the orders at para 74); Sue v Peart [2021] JMCC Comm 9. The assurance fund is the fallback if the land has passed to an innocent purchaser." }
 ]}
]
};

// Worksheet model answers (student versions). Ch3 omits the registered-land route until the progress quiz is in.
PAST.ch1.push({title:'Worksheet 1: model answers', sub:'Seminar 1, 1 October 2026. Estates and Interests in Land.', intro:'Try each question from the manual on your own first, under time. Then read the model answer and the marking guide and see what you missed.', html:"<h1 id=\"how-to-use-these-answers\">How to use these answers</h1>\n<p>Each answer opens with the short answer and the mistakes students most often make. The model answer follows in the form the worksheet asks for. Section numbers are from the Settled Land Act of Jamaica. Read the worksheet in the manual (Chapter 1) alongside these answers.</p>\n<h1 id=\"question-1-checklist-of-estates-and-interests-in-land\">Question 1: checklist of estates and interests in land</h1>\n<p><strong>Short answer.</strong> Four estates (fee simple, fee tail, life estate, leasehold), each capable of existing in possession, remainder or reversion, plus the equitable interests. For each one the checklist must say how it is created, what authority supports it and what the holder can do with it.</p>\n<p><strong>Common mistakes.</strong> Citing the Settled Land Act as the source of the estates themselves. It is not. It confers powers on people who hold limited estates. Students also forget to say anything practical.</p>\n<h2 id=\"model-checklist\">Model checklist</h2>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Estate or interest</th>\n<th>What it is and how it is created</th>\n<th>Authority</th>\n<th>Practical implications for the client</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Fee simple absolute in possession</td>\n<td>The largest estate. Lasts indefinitely. Created by \u201cto A in fee simple\u201d. A devise without words of limitation passes whatever the testator had</td>\n<td>Common law doctrine of estates. Wills Act. Intestates\u2019 Estates and Property Charges Act. Registration of Titles Act: the proprietor is registered as holding \u201can estate in fee simple\u201d</td>\n<td>May sell, give, mortgage, lease or devise without restriction. Passes to next of kin on intestacy. The only estate a buyer or lender ordinarily wants</td>\n</tr>\n<tr class=\"even\">\n<td>Determinable fee simple</td>\n<td>A fee simple that ends automatically on a stated event. Words of duration: \u201cuntil\u201d, \u201cduring\u201d, \u201cfor so long as\u201d</td>\n<td>Common law. Settled Land Act s.64(1)(b): the holder has the powers of a tenant for life</td>\n<td>The land reverts to the grantor when the event occurs. Hard to sell or mortgage at full value. Check whether the event has already occurred</td>\n</tr>\n<tr class=\"odd\">\n<td>Conditional fee simple</td>\n<td>A fee simple granted outright with a condition that may cut it short. Words of condition: \u201cprovided that\u201d, \u201con condition that\u201d, \u201cbut if\u201d</td>\n<td>Common law. Settled Land Act s.64(1)(b)</td>\n<td>Does not end until the grantor re-enters after breach. A condition that is uncertain or contrary to public policy is void and the estate becomes absolute</td>\n</tr>\n<tr class=\"even\">\n<td>Fee tail</td>\n<td>Lasts for the life of the grantee and his lineal descendants. \u201cTo A and the heirs of his body\u201d. May be limited to male or female heirs</td>\n<td>Common law. Still part of Jamaican law. Settled Land Act s.64(1)(a)</td>\n<td>Cannot be devised. A transferee takes subject to the rights of the heirs. The tenant in tail in possession can sell the fee simple under the Act. Rare, but the attorney must recognise the words</td>\n</tr>\n<tr class=\"odd\">\n<td>Life estate</td>\n<td>Lasts for the holder\u2019s life. \u201cTo A for life\u201d. Common in wills: to the widow for life, then to the children. May be made to end sooner, for example on remarriage</td>\n<td>Common law. Settled Land Act s.2(2), s.2(6), s.64(1)(f)</td>\n<td>Entitled to possession, rents and profits. Cannot devise it. Nothing passes on intestacy. May transfer it, but the transferee holds only while the life tenant lives. Has statutory power to sell, lease or exchange the fee simple subject to the safeguards of the Act</td>\n</tr>\n<tr class=\"even\">\n<td>Estate pur autre vie</td>\n<td>A life estate measured by someone else\u2019s life. \u201cTo A for the life of C\u201d. Also arises when a life tenant transfers her interest</td>\n<td>Common law. Settled Land Act s.64(1)(e)</td>\n<td>Ends when the measuring life ends, whatever the holder\u2019s age or health. Poor security</td>\n</tr>\n<tr class=\"odd\">\n<td>Leasehold</td>\n<td>Exclusive possession for a fixed and certain term. Carved out of a fee simple or out of a longer lease</td>\n<td>Common law of landlord and tenant. Registration of Titles Act provisions on leases. Walsh v Lonsdale for agreements for a lease</td>\n<td>The tenant may assign or sublet subject to the lease. The landlord keeps the reversion. Check the term, the rent, the covenants and whether the lease is registered or recorded</td>\n</tr>\n<tr class=\"even\">\n<td>Estates in remainder and in reversion</td>\n<td>Any of the above may be held without a present right to possession. Reversion: what the grantor keeps. Remainder: what a third party takes after the prior estate</td>\n<td>Common law. Settled Land Act s.2(3)</td>\n<td>Present interests. May be sold, given or devised now. On a sale under the Act they are overreached and attach to the capital money</td>\n</tr>\n<tr class=\"odd\">\n<td>Equitable interest under a trust</td>\n<td>Legal title in the trustee. Beneficial interest in the beneficiary</td>\n<td>Equity. Trustee Act</td>\n<td>Good against everyone except a bona fide purchaser of the legal estate for value without notice. For registered land protect it by caveat</td>\n</tr>\n<tr class=\"even\">\n<td>Equitable interest from an informal transaction</td>\n<td>Agreement for a lease. Equitable mortgage by deposit of title. Contract for sale (purchaser has an equitable interest from contract)</td>\n<td>Walsh v Lonsdale (1882) 21 Ch D 9. Statute of Frauds s.4 and part performance: Steadman v Steadman [1976] AC 536. Lysaght v Edwards (1876) 2 Ch D 499</td>\n<td>Depends on the availability of specific performance. Advise the client to complete the formalities and to lodge a caveat in the meantime</td>\n</tr>\n<tr class=\"odd\">\n<td>Interests created by equity</td>\n<td>Restrictive covenants. Proprietary estoppel: assurance, reliance, detriment</td>\n<td>Inwards v Baker [1965] 2 QB 29. Dillwyn v Llewelyn (1862) 45 ER 1285</td>\n<td>Search the title for covenants. Ask who is in occupation and on what basis. A relative who built on the land with the owner\u2019s encouragement may have a claim</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"essential-differences\">Essential differences</h2>\n<ol type=\"1\">\n<li><strong>Duration.</strong> Freehold estates are of uncertain length: nobody knows when a life will end or a line of heirs will fail. A leasehold has a fixed start and end.</li>\n<li><strong>Inheritance.</strong> The fee simple passes by will or on intestacy to anyone. The fee tail passes only to lineal descendants. The life estate passes to nobody.</li>\n<li><strong>Power of disposal.</strong> The fee simple owner can deal with the land freely. A limited owner can dispose of his own interest at common law. He can deal with the fee simple only through the Settled Land Act and on its terms.</li>\n<li><strong>Security.</strong> A legal estate binds the world. An equitable interest can be defeated by a bona fide purchaser for value without notice.</li>\n</ol>\n<h1 id=\"question-2-impact-of-the-settled-land-legislation-on-the-status-of-life-tenants\">Question 2: impact of the settled land legislation on the status of life tenants</h1>\n<p><strong>Short answer.</strong> The Act turned the life tenant from a person who could deal only with her own interest into the person who manages and may sell the whole fee simple. In exchange she is treated as a trustee, must follow a set procedure and never receives the capital.</p>\n<p><strong>Common mistakes.</strong> Describing the powers and stopping there. A good presentation gives equal time to the controls and ends with overreaching. A lease by a tenant for life must be by deed (s.10(1)); writing is enough only for a lease of three years or less (s.9(ii)).</p>\n<h2 id=\"outline-for-a-ten-minute-presentation\">Outline for a ten-minute presentation</h2>\n<ol type=\"1\">\n<li><strong>The problem at common law.</strong> A life tenant could not sell the fee simple because she did not own it. Successive life interests kept land in families for generations. Land could not be bought for development. The Jamaican Act follows the Settled Land Act 1882 of the United Kingdom, which was passed to make land marketable.</li>\n<li><strong>Two objectives.</strong> To make settled land marketable by giving the tenant for life wide powers over the fee simple. To protect everyone else entitled under the settlement.</li>\n<li><strong>When the Act applies.</strong> There must be a settlement: an instrument under which land stands limited to or in trust for persons by way of succession (s.2(2)). A joint tenancy or tenancy in common is concurrent ownership. It is not a settlement. Land to which an infant is entitled in possession is deemed settled (s.65).</li>\n<li><strong>Who has the powers.</strong> The tenant for life: the person beneficially entitled to possession for life (s.2(6)). Co-owners together (s.2(7)). The limited owners listed in s.64, who include the tenant in tail, the holder of a determinable or conditional fee, the tenant pur autre vie and the life tenant whose estate may end early.</li>\n<li><strong>The powers.</strong> Sale (s.3). Exchange (s.3). Lease: 99 years for building, 60 for mining, 21 for any other purpose (s.8). Mortgage for two purposes only: equality of exchange or partition (s.20) and discharge of an incumbrance (s.21). Contracts (s.37). Conveyance of the fee simple free of the settlement (s.23).</li>\n<li><strong>The controls.</strong> One month\u2019s notice by registered post to each of at least two trustees and to their attorney before the transaction or the contract for it (s.53). Best price or rent reasonably obtainable (ss.6, 10). Leases by deed, in possession within twelve months, with a covenant to pay rent and a right of re-entry, recorded within six months (s.10). Capital money to two trustees or into court, never to the tenant for life (ss.25, 47). Deemed trusteeship (s.59). Either side may take a difference to the court (s.52).</li>\n<li><strong>The trustees.</strong> They do not consent and cannot veto. They receive notice, receive and invest capital money and may go to court. They are the trustees with a power of sale or those declared trustees for the purposes of the Act (s.2(9)). Failing that the court appoints (s.44(1)). The Trustee Act applies to appointment and retirement (s.46).</li>\n<li><strong>Powers that cannot be removed.</strong> Not assignable (s.56). Any term that forbids or discourages their exercise is void (s.57). No forfeiture (s.58). The settlement may add powers (s.63).</li>\n<li><strong>Effect of a sale: overreaching.</strong> The land becomes a fund. The tenant for life takes the income. The remainderman takes the capital when the life interest ends (s.25(5)-(6)).</li>\n<li><strong>Purchasers.</strong> Protected if in good faith (ss.48, 53(3), 60). Not protected if they knew of the abuse: Chandler v Bradley.</li>\n<li><strong>Authorities.</strong> Jacas v Jacas [2017] JMSC Civ 77. Middlemas v Stevens [1901] 1 Ch 574. Thomas v Williams (1883) 24 Ch D 558. Wheelwright v Walker (No 2) (1883) 31 WR 912. Re Paget\u2019s Settled Estates (1885) 30 Ch D 161. Re Wix [1916] 1 Ch 279.</li>\n<li><strong>Conclusion on status.</strong> The life tenant is now a limited owner with the powers of an absolute owner and the duties of a trustee. The price of marketability is that the remainderman may receive money instead of land.</li>\n</ol>\n<h1 id=\"question-3-letter-of-advice-to-roxy-pinnock\">Question 3: letter of advice to Roxy Pinnock</h1>\n<p><strong>Short answer.</strong> Roxy can sell the fee simple in the farm. She cannot do it yet and she will not receive the $10,000,000. Trustees of the settlement must be in place, she must give them a month\u2019s notice before she contracts, she must get the best price and the money goes to the trustees to be invested. She receives income only and that income stops if she remarries.</p>\n<p><strong>Common mistakes.</strong> (1) Telling Roxy the money is hers. (2) Treating the insurance valuation as evidence of market value. An insurance assessment may bear no relationship to open market value. (3) Missing that notice must go out a month before the contract. (4) Saying Ricardo or the court must consent. Neither is required. (5) Ignoring remarriage.</p>\n<p><strong>Facts you must get.</strong> Whether the will has been probated and the farm vested in Roxy; whether title is registered; whether the will appoints trustees for the purposes of the Act. Ricardo is a minor whatever his exact age.</p>\n<h2 id=\"what-to-ask-roxy-in-the-interview\">What to ask Roxy in the interview</h2>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Topic</th>\n<th>Questions to ask</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>The will and the estate</td>\n<td>Do you have the will? Has probate been granted? Who are the executors? Does the will name trustees? Has the farm been transferred out of Almando\u2019s name?</td>\n</tr>\n<tr class=\"even\">\n<td>The title</td>\n<td>Is there a registered title? Where is the duplicate certificate? Any mortgage or caveat? Any tenants or workers living on the farm?</td>\n</tr>\n<tr class=\"odd\">\n<td>The offer</td>\n<td>Is the offer in writing? Has Tomas paid anything? Has anything been signed? Is there an agent? Has anyone else shown interest?</td>\n</tr>\n<tr class=\"even\">\n<td>The valuation</td>\n<td>Who prepared it, when and for what purpose? Does it state an open market value?</td>\n</tr>\n<tr class=\"odd\">\n<td>Roxy\u2019s aims</td>\n<td>Do you want to be free of the farm, or do you need capital? Where will you and Ricardo live? Would renting the farm out solve the problem?</td>\n</tr>\n<tr class=\"even\">\n<td>Remarriage</td>\n<td>Is remarriage in view? Explain why you are asking</td>\n</tr>\n<tr class=\"odd\">\n<td>Ricardo</td>\n<td>Date of birth. Who has custody. His schooling and needs</td>\n</tr>\n<tr class=\"even\">\n<td>Trustees</td>\n<td>Can you suggest two adults of good standing who would be willing to act?</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"model-letter\">Model letter</h2>\n<p>LAWYA &amp; ASSOCIATES<br>Attorneys-at-Law</p>\n<p>1 October 2026</p>\n<p>Mrs Roxy Pinnock<br>[Address]</p>\n<p>Dear Mrs Pinnock,</p>\n<p><strong>Re: Proposed sale of the 10-acre banana farm in St Mary: Estate of Almando Pinnock, deceased</strong></p>\n<p>Thank you for coming in to see us. You asked whether you can accept Mr Tomas\u2019s offer of $10,000,000 for the farm and what you would need to do. The short answer is that the law allows you to sell the farm, but it sets conditions that must be met first and the sale money will not be paid over to you. Please do not sign anything with Mr Tomas or accept any money from him until the steps in this letter have been taken.</p>\n<p><strong>1. What the will gave you</strong></p>\n<p>Your husband left the farm to you provided you do not remarry and, on your death, to Ricardo. In law you hold what is called a life interest. You are entitled to occupy the farm and to keep what it earns. Ricardo is entitled to the farm outright when your interest ends. Because the two of you are entitled one after the other, the farm is \u201csettled land\u201d and the Settled Land Act applies to it. The Act calls you the tenant for life.</p>\n<p><strong>2. You have power to sell the farm itself</strong></p>\n<p>On your own you could pass on only your life interest, which no developer would buy. The Act deals with this by giving a tenant for life the power to sell the land outright (section 3). The will cannot take that power away (section 57). Using the power does not cost you your interest (section 58). You do not need Ricardo\u2019s consent. You do not need the court\u2019s permission for the sale itself.</p>\n<p><strong>3. The purchase money will not be paid to you</strong></p>\n<p>This is the most important point in this letter. The purchase money must be paid to the trustees of the settlement, of whom there must be at least two, or into court (sections 25 and 47). The trustees invest it in the ways the Act allows. You may tell them which of those investments to choose. You then receive the income from the investment for as long as your interest lasts. When your interest ends, the fund belongs to Ricardo. In effect Ricardo\u2019s right moves from the land to the money. If your aim is to have $10,000,000 in hand, a sale will not achieve it.</p>\n<p><strong>4. Remarriage</strong></p>\n<p>Your interest depends on your remaining unmarried. A sale does not change that. If you remarry, your right to the income ends in the same way that your right to the farm would have ended. Please let us know in confidence whether you have any plans to remarry, because that affects whether a sale would be worth your while.</p>\n<p><strong>5. What must be done before a sale</strong></p>\n<ol type=\"a\">\n<li><p><em>The estate.</em> We need to see the will, the grant of probate and the title to the farm. If the farm is still in your husband\u2019s name, the executors must first have it transferred so that the title shows you as holder for life with Ricardo to follow.</p></li>\n<li><p><em>Trustees.</em> We must check whether the will appoints trustees for the purposes of the Settled Land Act. If it does not, we will apply to the Supreme Court to have two suitable persons appointed (section 44). You may put forward names. They should be adults of good character with no interest in the sale who agree in writing to act. The application takes time and carries a cost, which we will estimate for you.</p></li>\n<li><p><em>Notice.</em> At least one month before you sign a contract, you must send each trustee written notice by registered post that you intend to sell (section 53). The trustees cannot forbid the sale. They may ask you for details and may go to court if they think it is being handled improperly.</p></li>\n<li><p><em>Price.</em> The Act requires you to obtain the best price that can reasonably be obtained (section 6). The valuation you have was prepared for insurance. An insurance valuation estimates what it would cost to replace what is on the land. It is not a guide to what the land would fetch on the open market. Mr Tomas is a developer and will have valued ten acres in St Mary for what can be built there. You need a current market valuation from a qualified valuator. The farm should also be advertised so that other buyers have a chance to offer. If a better offer comes in, you must consider it.</p></li>\n<li><p><em>Your duty to Ricardo.</em> When you sell, the law treats you as a trustee for Ricardo (section 59). He is a minor until he is 18. If the farm were sold for less than it is worth, the sale could be challenged in court and you could be held personally responsible for the loss.</p></li>\n</ol>\n<p><strong>6. Another option: lease the farm</strong></p>\n<p>If the real difficulty is the burden of running the farm after the recent weather damage, you may wish to lease it instead. The Act allows you to lease the farm for up to 21 years at the best rent reasonably obtainable (sections 8 and 10). Rent is income, so it is paid to you. The farm stays in the family for Ricardo. We can explain the formal requirements if this is of interest.</p>\n<p><strong>7. What we need from you</strong></p>\n<ol type=\"1\">\n<li>The will and the grant of probate, or the names of the executors and their attorneys.</li>\n<li>The title for the farm or its volume and folio numbers.</li>\n<li>The valuation report.</li>\n<li>Anything Mr Tomas has put in writing. Please tell us whether he has paid you any money.</li>\n<li>The names and addresses of two persons you would like to propose as trustees.</li>\n<li>Ricardo\u2019s birth certificate.</li>\n</ol>\n<p>Once we have these we will confirm the steps, the likely timetable and our fees. In the meantime you may tell Mr Tomas that you are taking legal advice and that any sale must follow the procedure the law lays down.</p>\n<p>Yours faithfully,<br>LAWYA &amp; ASSOCIATES</p>\n<h2 id=\"how-its-marked-20-marks\">How it\u2019s marked (20 marks)</h2>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Element</th>\n<th>Marks</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Identifies the life interest, the settlement and Roxy as tenant for life, with sections</td>\n<td>3</td>\n</tr>\n<tr class=\"even\">\n<td>States the power to sell the fee simple and that it cannot be excluded</td>\n<td>2</td>\n</tr>\n<tr class=\"odd\">\n<td>Trustees: who they are, the need for two, court application if none</td>\n<td>3</td>\n</tr>\n<tr class=\"even\">\n<td>Notice: one month, registered post, before contract</td>\n<td>2</td>\n</tr>\n<tr class=\"odd\">\n<td>Best price and the insurance valuation point</td>\n<td>3</td>\n</tr>\n<tr class=\"even\">\n<td>Capital money, income only, overreaching explained in plain words</td>\n<td>3</td>\n</tr>\n<tr class=\"odd\">\n<td>Ricardo\u2019s minority, the deemed trusteeship and the effect of remarriage</td>\n<td>2</td>\n</tr>\n<tr class=\"even\">\n<td>Letter form, plain language for a lay client, clear next steps</td>\n<td>2</td>\n</tr>\n</tbody>\n</table>\n<h1 id=\"question-4-memorandum-on-the-will-of-john-brown\">Question 4: memorandum on the will of John Brown</h1>\n<p><strong>Short answer.</strong> Clause 3 gives Sue a life interest in the house at Paradise Close that ends on her death or remarriage, with the fee simple in remainder to Bill, Bob and Tom as joint tenants. The will creates a settlement. Sue is the tenant for life. The executors, Paul Biggs and Sam Small, are the trustees of the settlement because the will appoints them \u201cfor all the purposes of the Settled Land and Conveyance Laws\u201d. Tom\u2019s \u201cliberty to share occupancy\u201d is a personal right to live in the house alongside Sue. It is not an estate and cannot stop Sue selling.</p>\n<p><strong>Common mistakes.</strong> (1) Missing the appointment clause and advising a court application that is not needed. (2) Treating Tom as a co-life tenant. (3) Assuming the remaindermen are tenants in common. Compare the Jacas will in the precedents folder, where \u201cshare and share alike\u201d produced the tenancy in common shown on the certificate of title. (4) Saying Bill and Bob may occupy now.</p>\n<h2 id=\"model-memorandum\">Model memorandum</h2>\n<p><strong>To:</strong> Supervising Attorney<br><strong>From:</strong> Associate<br><strong>Date:</strong> 1 October 2026<br><strong>Re:</strong> Estate of John Albert Brown, deceased: construction of clause 3 of the will (devise to Sue) and its effect on Sue, Bill, Bob and Tom</p>\n<p><strong>1. Summary of advice</strong></p>\n<ol type=\"1\">\n<li>Sue takes a life interest in the house, furniture and fixtures at Paradise Close which ends on her death or earlier remarriage.</li>\n<li>Bill, Bob and Tom take the fee simple in remainder as joint tenants. Their interests are vested now. Their right to possession is postponed until Sue dies or remarries.</li>\n<li>The house is settled land. Sue is the tenant for life with statutory power to sell, lease or exchange it. Mr Biggs and Mr Small are the trustees of the settlement.</li>\n<li>Tom has, in addition, a personal right to share occupation of the house with Sue. It gives him no estate, no right to exclude Sue and no veto over a sale.</li>\n<li>Three further points on the will need instructions before the estate is distributed. They are set out in section 8.</li>\n</ol>\n<p><strong>2. What is given</strong></p>\n<p>The words \u201cmy house furniture and fixtures\u201d could be read as \u201chousehold furniture\u201d. Read with \u201c(matrimonial home)\u201d, \u201cremainder\u201d and \u201coccupancy of the house\u201d, the clause plainly disposes of the house itself together with its furniture and fixtures. The house is land. The furniture is personalty in which Sue takes the same limited interest.</p>\n<p><strong>3. Sue\u2019s estate</strong></p>\n<p>The will gives \u201ca life interest \u2026 with remainder upon her death or re-marriage\u201d. These are words that fix how long the estate lasts. Sue has a life estate determinable on remarriage. Because the limit is part of the definition of the estate, it is not open to attack as a condition in restraint of marriage. In any case a restriction on the remarriage of a surviving spouse is generally valid.</p>\n<p><strong>4. The Settled Land Act applies</strong></p>\n<p>The will is an instrument under which land stands limited to persons by way of succession. It is a settlement: s.2(2). The house is settled land: s.2(4). Sue is beneficially entitled to possession for her life and is the tenant for life: s.2(6). That her estate may end sooner on remarriage does not alter this: s.64(1)(f).</p>\n<p>The trustees of the settlement are the persons declared by the settlement to be trustees for the purposes of the Act: s.2(9). The will appoints Mr Biggs and Mr Small \u201cTrustees hereof for all the purposes of the Settled Land and Conveyance Laws\u201d. \u201cLaw\u201d was the former style of Jamaican statutes, so the reference is to what is now the Settled Land Act. The appointment is effective. There are two trustees, which satisfies ss.47 and 53(2). No application to the court under s.44 is needed unless one of them has died or declines to act.</p>\n<p><strong>5. Implications for Sue</strong></p>\n<ol type=\"1\">\n<li><em>Possession.</em> She is entitled to exclusive possession and to the rents and profits for as long as her interest lasts. The remaindermen have no right to enter or occupy: Jacas v Jacas [2017] JMSC Civ 77, where a life tenant under a will obtained an interim injunction keeping the remaindermen, including one who was an executor, out of the house.</li>\n<li><em>Powers.</em> She may sell the fee simple (s.3), lease for up to 21 years (s.8) or exchange. She may mortgage the house only to raise equality money or to pay off an incumbrance (ss.20-21). The will cannot remove these powers and she cannot bargain them away (ss.56-57).</li>\n<li><em>Procedure.</em> One month\u2019s notice by registered post to both trustees before any contract (s.53). Best price reasonably obtainable (s.6). Purchase money to the trustees or into court (ss.25, 47). She acts as a trustee for the remaindermen (s.59) and must not use the powers for a collateral purpose: Middlemas v Stevens [1901] 1 Ch 574.</li>\n<li><em>After a sale.</em> She receives the income of the invested fund until death or remarriage. She never receives the capital.</li>\n<li><em>Limits.</em> She cannot leave the house by will. If she remarries her interest and her powers end at once. She should not commit waste. She should keep the property insured and the taxes paid.</li>\n<li><em>Title.</em> After probate the executors should have the house transferred to Sue for life or until remarriage and thereafter to Bill, Bob and Tom as joint tenants in fee simple, so that the register reflects the will.</li>\n</ol>\n<p><strong>6. Implications for Bill, Bob and Tom</strong></p>\n<ol type=\"1\">\n<li><em>What they hold.</em> A fee simple in remainder, vested in interest from the testator\u2019s death. The gift is to the \u201cthree children\u201d with no words of severance such as \u201cequally\u201d or \u201cshare and share alike\u201d. They take as joint tenants, so the right of survivorship applies. If Bill dies before Sue, his interest passes to Bob and Tom and not to his own family. Any of them may sever during his lifetime, for example by transferring his interest.</li>\n<li><em>What they can do now.</em> Sell, give or mortgage their interest in remainder. They cannot occupy (Tom apart), collect rent or interfere with Sue\u2019s management.</li>\n<li><em>What they risk.</em> Sue may sell without their consent. Their interest would then attach to the proceeds in the trustees\u2019 hands. They may never receive the house.</li>\n<li><em>How they are protected.</em> The trustees receive notice of any dealing and hold the capital. Sue owes them a trustee\u2019s duties (s.59). They may sue for loss caused by a sale at an undervalue or in bad faith and may ask the court to restrain an improper sale.</li>\n<li><em>When Sue dies or remarries.</em> They become entitled in possession. They should apply to have the title noted, supported by the death or marriage certificate.</li>\n</ol>\n<p><strong>7. Tom\u2019s liberty to share occupancy</strong></p>\n<p>As one of three joint owners in remainder Tom will be entitled to occupy once the remainder falls into possession. The added words would be pointless if they referred to that period. They must refer to the period of Sue\u2019s life interest. Tom may therefore live in the house with Sue while her interest lasts.</p>\n<p>The right is personal and permissive (\u201cat liberty\u201d). It is shared and gives no exclusive possession. It is not an estate in the land and does not make Tom a tenant for life jointly with Sue under s.2(7). Whether words in a will create an estate or a mere right of residence is a question of construction of the words in the context of the whole document. Contrast the cases in the manual in which a person given the sole right to reside was treated as having the powers of a tenant for life: Re Carne\u2019s Settled Estates [1899] 1 Ch 324; Re Baroness Llanover [1902] 2 Ch 679; Re Anderson [1920] 1 Ch 175.</p>\n<p>Consequences. Sue cannot exclude Tom while she holds the house. Tom cannot exclude Sue or bring in others as of right. Tom cannot prevent a sale, because a term that would put the tenant for life in a position inconsistent with selling is void to that extent: s.57; Re Paget\u2019s Settled Estates (1885) 30 Ch D 161. On a sale the purchaser takes free of Tom\u2019s right. Tom cannot assign the right or leave it by will.</p>\n<p><strong>8. Other matters on the face of the will</strong></p>\n<ol type=\"1\">\n<li><em>Clause 7.</em> It reads as a recital lifted from an instrument of transfer (\u201cthe Transferor has agreed to transfer \u2026 in consideration of the love and affection\u201d) and names \u201cmy three children, Paul, Grace and David\u201d. It contains no words of gift. The children named do not match Bill, Bob and Tom. The 23 acres in St Elizabeth registered at Volume 1000 Folio 33 are probably not disposed of by this clause and would fall into residue under clauses 8 and 9, to be shared equally by Sue and the three children. We need to establish who the testator\u2019s children are and whether any lifetime transfer was made.</li>\n<li><em>Attesting witness.</em> One witness signs as \u201cThomas Most\u201d. If he is the \u201cTom\u201d of clause 3, the gift to him is at risk under the Wills Act rule that a gift to an attesting witness is void. The will would remain valid. Check the section in the Wills Act.</li>\n<li><em>Matrimonial home.</em> The testator describes the house as the matrimonial home. Sue may have rights that do not depend on the will: a claim to a half share of the family home under the Property (Rights of Spouses) Act and a claim for provision under the Inheritance (Provision for Family and Depend
